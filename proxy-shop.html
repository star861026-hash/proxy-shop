<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopTrack 代購管理系統</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#faf8f5;color:#2d1f1a;}
    .container{max-width:500px;margin:0 auto;padding:12px;min-height:100vh;}
    .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
    .btn{padding:12px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;}
    .btn-primary{background:linear-gradient(135deg,#7cb87a,#9ed09c);color:#fff;width:100%;margin:8px 0;}
    .btn-secondary{background:#f5f5f5;color:#666;width:100%;margin:8px 0;}
    .btn-small{padding:6px 10px;width:auto;font-size:12px;margin:2px;}
    input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0;font-size:14px;font-family:inherit;}
    textarea{resize:vertical;min-height:60px;}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;overflow-y:auto;}
    .modal.hide{display:none;}
    .modal-content{background:#fff;border-radius:16px;padding:20px;margin:20px auto;max-width:480px;width:90%;}
    .tabs{display:flex;gap:8px;margin:12px 0;background:#fffaf5;padding:8px;border-radius:12px;overflow-x:auto;}
    .tab-btn{flex-shrink:0;padding:10px;border:none;border-radius:10px;cursor:pointer;font-weight:700;background:transparent;color:#8a6a5a;font-family:inherit;font-size:13px;}
    .tab-btn.active{background:#c8756a;color:#fff;}
  </style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hide"><div class="modal-content" id="modal-body"></div></div>

<script>
const LSK=k=>`shoptrack_${k}`;
const load=(k,d)=>{try{const v=localStorage.getItem(LSK(k));return v?JSON.parse(v):d;}catch{return d;}};
const save=(k,v)=>{try{localStorage.setItem(LSK(k),JSON.stringify(v));}catch(e){alert('保存失败');}};

let state={screen:'login',nick:'',orders:load('orders',[]),clients:load('clients',[]),products:load('products',[]),wallets:load('wallets',{}),tab:'orders'};
const AGENT_PASSWORD='12345';

function saveState(){save('orders',state.orders);save('clients',state.clients);save('products',state.products);save('wallets',state.wallets);}

function getMemberLevel(dep){if(dep>=6000)return{name:"鑽石",cashback:0.02,icon:"💎"};if(dep>=4000)return{name:"黃金",cashback:0.01,icon:"🥇"};if(dep>=2000)return{name:"銀牌",cashback:0.01,icon:"🥈"};return{name:"無",cashback:0,icon:"👤"};}

function productPrice(p,level){if(!p)return 0;const price=parseFloat(p.price)||0;const rate=parseFloat(p.rate||0.275);return Math.ceil(price*rate);}

function openModal(html){document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').classList.remove('hide');}
function closeModal(){document.getElementById('modal').classList.add('hide');}

function addClientSave(){const n=document.getElementById("nc").value.trim();if(!n){alert('請輸入名字');return;}const c="C"+Date.now();state.clients.push({name:n,clientCode:c});state.wallets[c]={balance:0,paid:0,logs:[]};saveState();closeModal();render();}
function addClient(){openModal('<h3>新增客人</h3><input id="nc" placeholder="客人名字"/><button class="btn btn-primary" onclick="addClientSave()">新增</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>');}

function addProductSave(){const n=document.getElementById("pn").value.trim();const p=+(document.getElementById("pp").value||0);const r=+(document.getElementById("pr").value||0.275);if(!n||!p||!r){alert('請填完整');return;}state.products.push({name:n,price:p,rate:r});saveState();closeModal();render();}
function addProduct(){openModal('<h3>新增商品</h3><input id="pn" placeholder="名稱"/><input id="pp" placeholder="日幣" type="number"/><input id="pr" placeholder="匯率(如0.275)" type="number" step="0.001" value="0.275"/><button class="btn btn-primary" onclick="addProductSave()">新增</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>');}

function saveProductEdit(i){state.products[i].name=document.getElementById('epn').value.trim();state.products[i].price=+(document.getElementById('epp').value||0);state.products[i].rate=+(document.getElementById('epr').value||0.275);saveState();closeModal();render();}
function editProduct(i){const p=state.products[i];if(!p){alert('找不到');return;}openModal(`<h3>編輯商品</h3><input id="epn" value="${p.name||''}"/><input id="epp" value="${p.price||''}" type="number"/><input id="epr" value="${p.rate||0.275}" type="number" step="0.001" placeholder="匯率"/><button class="btn btn-primary" onclick="saveProductEdit(${i})">儲存</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`);}
function delProduct(i){if(confirm('刪除?')){state.products.splice(i,1);saveState();render();}}

function addOrderSave(){const cn=document.getElementById('oc').value;const in_v=document.getElementById('oi').value;const pr=+(document.getElementById('opr').value||0);const rm=document.getElementById('orm').value.trim();if(!cn||!in_v||!pr){alert('請填完整');return;}state.orders.push({clientName:cn,item:in_v,price:pr,remark:rm,status:'pending',updatedAt:new Date().toLocaleDateString('zh-TW')});saveState();closeModal();render();}
function addOrder(){const opts=state.clients.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');const prodOpts=state.products.map(p=>`<option value="${p.name}">${p.name}(¥${p.price}→NT$${Math.ceil(p.price*p.rate)})</option>`).join('');openModal(`<h3>新增訂單</h3><select id="oc"><option>選客人</option>${opts}</select><select id="oi"><option>選商品</option>${prodOpts}</select><input id="opr" placeholder="日幣" type="number"/><textarea id="orm" placeholder="備註(買了什麼)"></textarea><button class="btn btn-primary" onclick="addOrderSave()">新增</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`);}

function saveOrderEdit(i){state.orders[i].item=document.getElementById('eoi').value.trim();state.orders[i].price=+(document.getElementById('eopr').value||0);state.orders[i].remark=document.getElementById('eorm').value.trim();state.orders[i].status=document.getElementById('eost').value;saveState();closeModal();render();}
function editOrder(i){const o=state.orders[i];if(!o){alert('找不到');return;}openModal(`<h3>編輯訂單</h3><input id="eoi" value="${o.item||''}" placeholder="商品"/><input id="eopr" value="${o.price||''}" type="number" placeholder="日幣"/><textarea id="eorm">${o.remark||''}</textarea><select id="eost"><option value="pending" ${o.status==='pending'?'selected':''}>待購</option><option value="bought" ${o.status==='bought'?'selected':''}>已買到</option><option value="completed" ${o.status==='completed'?'selected':''}>已完成</option></select><button class="btn btn-primary" onclick="saveOrderEdit(${i})">儲存</button><button class="btn btn-secondary" onclick="delOrder(${i})">刪除</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`);}
function delOrder(i){if(confirm('刪除?')){state.orders.splice(i,1);saveState();closeModal();render();}}

function openWallet(cc){const c=state.clients.find(x=>x.clientCode===cc);const w=state.wallets[cc]||{balance:0,paid:0};openModal(`<h3>💰${c?.name||'客人'}</h3><div style="padding:10px;background:#fffaf5;border-radius:8px;margin:8px 0;font-size:12px;"><div>購物金:NT$${w.balance||0}</div><div>已付款:NT$${w.paid||0}</div></div><input id="wam" placeholder="金額" type="number"/><button class="btn btn-primary" onclick="addWalletBalance('${cc}')">+購物金</button><button class="btn btn-secondary" onclick="addWalletPaid('${cc}')">✅已付款</button><button class="btn btn-secondary" onclick="closeModal()">關</button>`);}
function addWalletBalance(cc){const a=+(document.getElementById('wam').value||0);if(!a)return;if(!state.wallets[cc])state.wallets[cc]={balance:0,paid:0,logs:[]};state.wallets[cc].balance+=a;state.wallets[cc].logs=state.wallets[cc].logs||[];state.wallets[cc].logs.push({type:'add',amount:a});saveState();openWallet(cc);}
function addWalletPaid(cc){const a=+(document.getElementById('wam').value||0);if(!a)return;if(!state.wallets[cc])state.wallets[cc]={balance:0,paid:0,logs:[]};state.wallets[cc].paid+=a;state.wallets[cc].logs=state.wallets[cc].logs||[];state.wallets[cc].logs.push({type:'paid',amount:a});saveState();openWallet(cc);}

function render(){const app=document.getElementById('app');if(state.screen==='login'){app.innerHTML=`<div class="container" style="text-align:center;padding-top:80px;"><div style="font-size:48px;margin-bottom:20px;">🛍️</div><h1 style="margin-bottom:40px;">ShopTrack</h1><button class="btn btn-primary" onclick="state.screen='agent-login';render();">👑 闆闆登入</button><button class="btn btn-secondary" onclick="state.screen='client-login';render();">👤 客人登入</button></div>`;}else if(state.screen==='agent-login'){app.innerHTML=`<div class="container" style="text-align:center;padding-top:60px;"><h2 style="margin-bottom:30px;">闆闆登入</h2><input id="pwd" type="password" placeholder="輸入密碼"/><button class="btn btn-primary" onclick="loginAgent()">進入</button><button class="btn btn-secondary" onclick="state.screen='login';render();">返回</button></div>`;setTimeout(()=>document.getElementById('pwd')?.focus(),100);}else if(state.screen==='client-login'){app.innerHTML=`<div class="container" style="text-align:center;padding-top:60px;"><h2 style="margin-bottom:30px;">客人登入</h2><input id="cname" placeholder="輸入你的名字"/><button class="btn btn-primary" onclick="loginClient()">進入</button><button class="btn btn-secondary" onclick="state.screen='login';render();">返回</button></div>`;setTimeout(()=>document.getElementById('cname')?.focus(),100);}else if(state.screen==='client'){const c=state.clients.find(x=>x.name===state.nick)||{};const cc=c.clientCode||'';const w=state.wallets[cc]||{balance:0,paid:0,logs:[]};const myOrders=state.orders.filter(o=>o.clientName===state.nick);const totalDep=(w.logs||[]).filter(l=>l.type==='add').reduce((s,l)=>s+(l.amount||0),0);const level=getMemberLevel(totalDep);let html=`<div class="container"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><h2>${state.nick}</h2><button class="btn btn-secondary btn-small" onclick="state.screen='login';render();">登出</button></div>`;const total=myOrders.reduce((s,o)=>s+productPrice(o,level),0);const cashback=level.cashback>0?Math.ceil(total*level.cashback):0;const finalTotal=Math.max(0,total-cashback);const needToPay=Math.max(0,finalTotal-(w.balance||0));const unpaid=Math.max(0,needToPay-(w.paid||0));const lotteryTickets=Math.floor((w.paid||0)/888);html+=`<div class="card"><div style="padding:8px;background:#f0f8ff;border-radius:8px;margin-bottom:12px;text-align:center;"><span style="font-weight:700;">${level.icon} ${level.name}</span><br/><span style="font-size:11px;color:#666;">儲值:NT$${totalDep}</span></div><div style="background:linear-gradient(135deg,#fff8f0,#fde8d8);border-radius:12px;padding:12px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin:6px 0;"><span>📦 商品合計</span><span style="font-weight:700;">NT$${total}</span></div>`;if(cashback>0)html+=`<div style="display:flex;justify-content:space-between;font-size:13px;margin:6px 0;color:#22c55e;"><span>${level.icon}會員回饋</span><span style="font-weight:700;">-NT$${cashback}</span></div>`;html+=`<div style="display:flex;justify-content:space-between;font-size:13px;padding-top:8px;border-top:1px solid #f0d9cc;margin-top:8px;"><span>小計</span><span style="font-weight:700;">NT$${finalTotal}</span></div><div style="display:flex;justify-content:space-between;font-size:13px;margin:6px 0;"><span>💰 購物金</span><span style="font-weight:700;color:#4a9fd4;">NT$${w.balance||0}</span></div><div style="display:flex;justify-content:space-between;font-size:13px;margin:6px 0;"><span>✅ 已付款</span><span style="font-weight:700;color:#22c55e;">NT$${w.paid||0}</span></div><div style="display:flex;justify-content:space-between;font-size:13px;padding-top:8px;border-top:2px solid #f0d9cc;margin-top:8px;"><span style="font-weight:900;">❌ 未付款</span><span style="font-weight:900;color:#e11d48;font-size:15px;">NT$${unpaid}</span></div></div><div style="padding:10px;background:#fef3c7;border-radius:8px;margin-top:12px;border:2px solid #f59e0b;text-align:center;"><div style="font-weight:700;font-size:12px;">🎟️ 可兑換抽獎券</div><span style="font-size:20px;font-weight:700;color:#d97706;">${lotteryTickets}</span><span style="font-size:10px;display:block;">已付款÷888</span></div></div>`;html+=`<div class="card"><h3>購買明細(${myOrders.length})</h3>`;if(myOrders.length===0)html+=`<div style="text-align:center;color:#999;padding:20px;">還沒有訂單</div>`;else myOrders.forEach(o=>{const price=productPrice(o,level);const cb=level.cashback>0?Math.ceil(price*level.cashback):0;const finalPrice=price-cb;const fullName=o.remark?`${o.item||'商品'} - ${o.remark}`:o.item||'商品';html+=`<div style="padding:10px;background:#fffaf5;border-radius:8px;margin:6px 0;border-left:4px solid #c8756a;"><div style="font-weight:700;margin-bottom:4px;">${fullName}</div><div style="font-size:12px;display:flex;justify-content:space-between;margin:2px 0;"><span>日幣</span><span>¥${o.price||0}</span></div><div style="font-size:12px;display:flex;justify-content:space-between;margin:2px 0;"><span>台幣</span><span style="font-weight:700;">NT$${price}</span></div>`;if(cb>0)html+=`<div style="font-size:12px;display:flex;justify-content:space-between;margin:2px 0;color:#22c55e;"><span>回饋</span><span>-NT$${cb}</span></div>`;html+=`<div style="font-size:12px;display:flex;justify-content:space-between;margin:2px 0;padding-top:4px;border-top:1px solid #e0e0e0;font-weight:700;"><span>實付</span><span style="color:#c8756a;">NT$${finalPrice}</span></div></div>`});html+=`</div></div>`;app.innerHTML=html;}else if(state.screen==='agent'){let html=`<div class="container"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><h2>👑 業者後台</h2><button class="btn btn-secondary btn-small" onclick="state.screen='login';render();">登出</button></div><div class="tabs"><button class="tab-btn ${state.tab==='orders'?'active':''}" onclick="state.tab='orders';render();">📋訂單</button><button class="tab-btn ${state.tab==='products'?'active':''}" onclick="state.tab='products';render();">📦商品</button><button class="tab-btn ${state.tab==='clients'?'active':''}" onclick="state.tab='clients';render();">👤客人</button><button class="tab-btn ${state.tab==='lottery'?'active':''}" onclick="state.tab='lottery';render();">🎟️抽獎</button><button class="tab-btn ${state.tab==='summary'?'active':''}" onclick="state.tab='summary';render();">📊對帳</button><button class="tab-btn ${state.tab==='settings'?'active':''}" onclick="state.tab='settings';render();">⚙️</button></div>`;if(state.tab==='orders'){html+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>訂單(${state.orders.length})</h3><button class="btn btn-primary btn-small" onclick="addOrder()">+新增</button></div>`;state.orders.forEach((o,i)=>{const fullName=o.remark?`${o.item||'商品'}-${o.remark}`:o.item||'商品';html+=`<div style="padding:8px;background:#fffaf5;border-radius:8px;margin:4px 0;"><div style="display:flex;justify-content:space-between;"><div><strong>${o.clientName||'客人'}</strong><br/><span style="font-size:11px;">${fullName}</span><br/><span style="font-size:10px;color:#666;">¥${o.price||0} | ${o.status||'待購'}</span></div><button class="btn btn-primary btn-small" onclick="editOrder(${i})">編</button></div></div>`;}); html+=`</div>`;}if(state.tab==='products'){html+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>商品(${state.products.length})</h3><button class="btn btn-primary btn-small" onclick="addProduct()">+新增</button></div>`;state.products.forEach((p,i)=>{const twPrice=Math.ceil((p.price||0)*(p.rate||0.275));html+=`<div style="padding:8px;background:#fffaf5;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;"><div style="flex:1;"><strong>${p.name||'商品'}</strong><br/><span style="font-size:11px;">¥${p.price||0} × ${(p.rate||0.275).toFixed(3)} = NT$${twPrice}</span></div><button class="btn btn-primary btn-small" onclick="editProduct(${i})">編</button><button class="btn btn-secondary btn-small" onclick="delProduct(${i})">刪</button></div>`;}); html+=`</div>`;}if(state.tab==='clients'){html+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>客人(${state.clients.length})</h3><button class="btn btn-primary btn-small" onclick="addClient()">+新增</button></div>`;state.clients.forEach(c=>{const w=state.wallets[c.clientCode]||{balance:0,paid:0};const myOrders=state.orders.filter(o=>o.clientName===c.name);const totalDep=(w.logs||[]).filter(l=>l.type==='add').reduce((s,l)=>s+(l.amount||0),0);const level=getMemberLevel(totalDep);const total=myOrders.reduce((s,o)=>s+productPrice(o,level),0);const cashback=level.cashback>0?Math.ceil(total*level.cashback):0;const finalTotal=Math.max(0,total-cashback);const needToPay=Math.max(0,finalTotal-(w.balance||0));const unpaid=Math.max(0,needToPay-(w.paid||0));html+=`<div style="padding:8px;background:#fffaf5;border-radius:8px;margin:4px 0;"><div><strong>${c.name}</strong> ${level.icon}<br/><span style="font-size:10px;color:#666;">購物:NT$${w.balance||0} | 付:NT$${w.paid||0} | 未付:NT$${unpaid}</span></div><button class="btn btn-primary btn-small" onclick="openWallet('${c.clientCode}')">管理</button></div>`;}); html+=`</div>`;}if(state.tab==='lottery'){html+=`<div class="card"><h3>🎟️抽獎券(每NT$888=1張)</h3>`;let totalTickets=0;state.clients.forEach(c=>{const w=state.wallets[c.clientCode]||{paid:0};const tickets=Math.floor((w.paid||0)/888);totalTickets+=tickets;html+=`<div style="padding:10px;background:#fffaf5;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;"><div><strong>${c.name}</strong><br/><span style="font-size:11px;color:#666;">已付:NT$${w.paid||0}</span></div><div style="text-align:right;"><span style="font-size:20px;font-weight:700;color:#f59e0b;">🎟️ ${tickets}</span></div></div>`;}); html+=`<div style="padding:12px;background:#fef3c7;border-radius:8px;margin-top:12px;text-align:center;border:2px solid #f59e0b;"><div style="font-weight:700;">🎉 總抽獎券</div><span style="font-size:24px;font-weight:700;color:#d97706;">🎟️ ${totalTickets}</span></div></div>`;}if(state.tab==='summary'){html+=`<div class="card"><h3>📊 全客對帳</h3>`;let totalAmount=0,totalCashback=0,totalFinal=0,totalPaid=0,totalUnpaid=0;state.clients.forEach(c=>{const w=state.wallets[c.clientCode]||{balance:0,paid:0,logs:[]};const myOrders=state.orders.filter(o=>o.clientName===c.name);const totalDep=(w.logs||[]).filter(l=>l.type==='add').reduce((s,l)=>s+(l.amount||0),0);const level=getMemberLevel(totalDep);const total=myOrders.reduce((s,o)=>s+productPrice(o,level),0);const cashback=level.cashback>0?Math.ceil(total*level.cashback):0;const finalTotal=Math.max(0,total-cashback);const needToPay=Math.max(0,finalTotal-(w.balance||0));const unpaid=Math.max(0,needToPay-(w.paid||0));totalAmount+=total;totalCashback+=cashback;totalFinal+=finalTotal;totalPaid+=w.paid||0;totalUnpaid+=unpaid;html+=`<div style="padding:10px;background:#fffaf5;border-radius:8px;margin:6px 0;"><div style="font-weight:700;margin-bottom:4px;">${c.name} ${level.icon}</div><div style="font-size:11px;line-height:1.6;"><div>📦商品:NT$${total} 回饋:-NT$${cashback}</div><div>💰小計:NT$${finalTotal} 購物金:NT$${w.balance||0}</div><div>✅已付:NT$${w.paid||0} ❌未付:NT$${unpaid}</div></div></div>`;}); html+=`<div style="padding:12px;background:#c8756a20;border-radius:8px;margin-top:12px;font-size:11px;line-height:1.8;"><div style="font-weight:700;">📈總計</div><div>商品:NT$${totalAmount} 回饋:-NT$${totalCashback}</div><div>小計:NT$${totalFinal} 已付:NT$${totalPaid}</div><div style="font-weight:700;color:#e11d48;">未付:NT$${totalUnpaid}</div></div></div>`;}if(state.tab==='settings'){html+=`<div class="card"><h3>⚙️設定</h3><div style="font-size:11px;color:#666;line-height:1.8;margin-bottom:12px;"><div>💡 商品設定:自訂匯率×日幣價格</div><div>💡 儲值優惠:獨立設定會員等級回饋</div><div>💡 抽獎券:每消費NT$888=1張</div><div style="margin-top:8px;padding-top:8px;border-top:1px solid #ddd;">會員等級回饋 (計入消費額)</div><div>👤無:0% | 🥈銀(≥2k):1% | 🥇金(≥4k):1% | 💎鑽(≥6k):2%</div></div><button class="btn btn-primary" onclick="exportExcel()">📥匯出Excel</button><button class="btn btn-secondary" onclick="exportJSON()">📥匯出JSON</button></div>`;}html+=`</div>`;app.innerHTML=html;}}

function loginAgent(){const pwd=document.getElementById('pwd')?.value;if(pwd===AGENT_PASSWORD){state.screen='agent';state.tab='orders';render();}else{alert('密碼錯誤');}}

function loginClient(){const name=document.getElementById('cname')?.value.trim();if(!name){alert('請輸入名字');return;}const c=state.clients.find(x=>x.name===name);if(!c){alert('找不到此客人');return;}state.nick=name;state.screen='client';render();}

function exportJSON(){const d={orders:state.orders,clients:state.clients,products:state.products,wallets:state.wallets,date:new Date().toLocaleString('zh-TW')};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`ShopTrack_${Date.now()}.json`;a.click();}

function exportExcel(){let c='商品\n名稱,日幣,匯率,台幣\n';state.products.forEach(p=>{const tw=Math.ceil((p.price||0)*(p.rate||0.275));c+=`"${p.name||''}",${p.price||0},${(p.rate||0.275).toFixed(3)},${tw}\n`;});c+='\n訂單\n客人,商品,備註,日幣,台幣,狀態\n';state.orders.forEach(o=>{c+=`"${o.clientName||''}","${o.item||''}","${o.remark||''}",${o.price||0},${productPrice(o,{})},${o.status||'待購'}\n`;});c+='\n客人\n名字,購物金,已付\n';state.clients.forEach(cl=>{const w=state.wallets[cl.clientCode]||{balance:0,paid:0};c+=`"${cl.name}",${w.balance||0},${w.paid||0}\n`;});const b=new Blob([c],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`ShopTrack_${Date.now()}.csv`;a.click();}

render();
</script>
