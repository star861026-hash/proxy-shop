<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopTrack 代購管理系統</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#faf8f5;color:#2d1f1a;}
    .container{max-width:500px;margin:0 auto;padding:12px;min-height:100vh;}
    .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
    .btn{padding:12px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;transition:all 0.2s;}
    .btn-primary{background:linear-gradient(135deg,#7cb87a,#9ed09c);color:#fff;}
    .btn-primary:active{transform:scale(0.98);}
    .IS{padding:10px 12px;border:1.5px solid #d0c0b8;border-radius:10px;background:#fff;font-size:14px;font-family:inherit;}
    .chip{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;}
    .tap{transition:all 0.2s;user-select:none;}
    .tap:active{opacity:0.8;transform:scale(0.98);}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const RATE_TYPES={general:{label:"一般",rate:0.275},ticket:{label:"門票",rate:0.295},souvenir:{label:"土產",rate:0.285},gacha:{label:"扭蛋",rate:null}};
const GACHA_PRICES=[{jpy:200,twd:60},{jpy:300,twd:80},{jpy:400,twd:110},{jpy:500,twd:140}];
function gachaTWD(jpy,keepShell){const r=GACHA_PRICES.find(x=>x.jpy===+jpy);return (r?r.twd:60)+(keepShell?5:0);}
const MEMBER_LEVELS=[{name:"鑽石優惠",minDeposit:6000,cashback:0.02,icon:"💎"},{name:"黃金優惠",minDeposit:4000,cashback:0.01,icon:"🥇"},{name:"銀牌優惠",minDeposit:2000,cashback:0.01,icon:"🥈"},{name:"無優惠",minDeposit:0,cashback:0,icon:"👤"}];
function getMemberLevel(dep){return MEMBER_LEVELS.find(l=>dep>=l.minDeposit)||MEMBER_LEVELS[3];}
const STATUS={pending:{label:"待購買",icon:"⏳"},bought:{label:"已買到",icon:"✅"},arrived_tw:{label:"已到貨",icon:"📥"},consolidating:{label:"集運回台中",icon:"🚢"},shipped:{label:"已出貨",icon:"📬"},arrived:{label:"已到台灣",icon:"📦"},completed:{label:"已完成",icon:"🎉"},cancelled:{label:"已取消",icon:"❌"}};
const LSK=k=>`shoptrack_${k}`;
function load(k,d){try{const v=localStorage.getItem(LSK(k));return v?JSON.parse(v):d;}catch{return d;}}
function save(k,v){try{localStorage.setItem(LSK(k),JSON.stringify(v));}catch(e){alert("儲存失敗");}}

function App(){
  const [isAgent,setIsAgent]=React.useState(null);
  const [nick,setNick]=React.useState("");
  const [orders,setOrders]=React.useState(()=>load("orders",[]));
  const [clients,setClients]=React.useState(()=>load("clients",[]));
  const [wallets,setWallets]=React.useState(()=>load("wallets",{}));

  React.useEffect(()=>{save("orders",orders);save("clients",clients);save("wallets",wallets);},[orders,clients,wallets]);

  const [toast,setToast]=React.useState(null);
  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(null),2000);};

  if(isAgent===null){
    return(
      <div style={{textAlign:"center",paddingTop:100}}>
        <div style={{fontSize:48,marginBottom:20}}>🛍️</div>
        <div style={{fontSize:24,fontWeight:900,marginBottom:30}}>ShopTrack</div>
        <button onClick={()=>setIsAgent(true)} className="btn btn-primary" style={{width:200,marginBottom:10}}>👑 闆闆登入</button>
        <button onClick={()=>setIsAgent(false)} className="btn" style={{width:200,background:"#f0fdf4",color:"#166534"}}>👤 客人登入</button>
      </div>
    );
  }

  if(isAgent){
    return <AgentView {...{orders,setOrders,clients,setClients,wallets,setWallets,showToast,setIsAgent}}/>;
  }else{
    if(!nick){
      return(
        <div style={{textAlign:"center",paddingTop:100}}>
          <input className="IS" placeholder="輸入名字" value={nick} onChange={e=>setNick(e.target.value)} style={{width:200,marginBottom:10}}/>
          <button className="btn btn-primary" style={{width:200}} onClick={()=>setNick(nick)}>進入</button>
          <button className="btn" style={{width:200,background:"#f5f5f5",marginTop:10}} onClick={()=>setIsAgent(null)}>返回</button>
        </div>
      );
    }
    return <ClientView {...{nick,setNick,clients,orders,wallets,setWallets,showToast,setIsAgent}}/>;
  }
}

function ClientView({nick,setNick,clients,orders,wallets,setWallets,showToast,setIsAgent}){
  const c=clients.find(x=>x.name===nick);
  const w=wallets[c?.clientCode]||{balance:0,logs:[]};
  const myOrders=orders.filter(o=>o.clientName===nick);
  
  return(
    <div className="container">
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
        <div style={{fontWeight:900}}>{nick}</div>
        <button className="btn" style={{padding:"6px 12px",background:"#f5f5f5",fontSize:12}} onClick={()=>{setNick("");setIsAgent(null);}}>登出</button>
      </div>
      <div className="card">
        <div style={{fontWeight:700,marginBottom:8}}>訂單 ({myOrders.length})</div>
        {myOrders.map(o=>(
          <div key={o.id} style={{padding:10,background:"#fffaf5",borderRadius:8,marginBottom:8}}>
            <div>{o.item} - {STATUS[o.status]?.label}</div>
            <div style={{fontSize:12,color:"#666"}}>NT${o.price}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div style={{fontWeight:700,marginBottom:8}}>購物金</div>
        <div>餘額: NT${w.balance}</div>
      </div>
    </div>
  );
}

function AgentView({orders,setOrders,clients,setClients,wallets,setWallets,showToast,setIsAgent}){
  const [tab,setTab]=React.useState("orders");

  return(
    <div className="container">
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
        <div style={{fontWeight:900}}>👑 業者</div>
        <button className="btn" style={{padding:"6px 12px",background:"#f5f5f5",fontSize:12}} onClick={()=>setIsAgent(null)}>登出</button>
      </div>

      {tab==="orders"&&<div><div style={{fontWeight:700,marginBottom:12}}>訂單 ({orders.length})</div>{orders.map(o=><div key={o.id} className="card" style={{marginBottom:8}}><div>{o.clientName} - {o.item}</div><div style={{fontSize:12,color:"#666"}}>{STATUS[o.status]?.label}</div></div>)}</div>}
      {tab==="clients"&&<div><div style={{fontWeight:700,marginBottom:12}}>客人 ({clients.length})</div>{clients.map(c=><div key={c.clientCode} className="card" style={{marginBottom:8}}><div>{c.name}</div></div>)}<button className="btn btn-primary" style={{width:"100%"}} onClick={()=>{const name=prompt("名字");if(!name)return;setClients([...clients,{name,clientCode:`C${Date.now()}`}]);showToast("已新增");}}>+新增</button></div>}
      {tab==="settings"&&<div><div className="card"><button className="btn btn-primary" style={{width:"100%"}} onClick={()=>{if(window.confirm("確定清除所有訂單?")){setOrders([]);showToast("已清除");}}}> 🗑️ 清除所有訂單</button></div></div>}

      <div style={{display:"flex",gap:8,marginTop:20,background:"#fffaf5",borderRadius:12,padding:8}}>
        <button className="tap" onClick={()=>setTab("orders")} style={{flex:1,padding:10,borderRadius:10,border:"none",background:tab==="orders"?"#c8756a":"transparent",color:tab==="orders"?"#fff":"#8a6a5a",fontWeight:700}}>📋</button>
        <button className="tap" onClick={()=>setTab("clients")} style={{flex:1,padding:10,borderRadius:10,border:"none",background:tab==="clients"?"#c8756a":"transparent",color:tab==="clients"?"#fff":"#8a6a5a",fontWeight:700}}>👤</button>
        <button className="tap" onClick={()=>setTab("settings")} style={{flex:1,padding:10,borderRadius:10,border:"none",background:tab==="settings"?"#c8756a":"transparent",color:tab==="settings"?"#fff":"#8a6a5a",fontWeight:700}}>⚙️</button>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
