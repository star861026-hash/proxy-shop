<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopTrack</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft JhengHei', sans-serif; background: #faf8f5; color: #2d1f1a; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card { background: white; border-radius: 16px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .btn { padding: 12px 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; width: 100%; margin: 8px 0; }
    .btn-primary { background: linear-gradient(135deg, #7cb87a, #9ed09c); color: white; }
    .btn-secondary { background: #f5f5f5; color: #666; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin: 8px 0; font-size: 14px; }
    .hide { display: none !important; }
    .center { text-align: center; padding: 40px 20px; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
const LSK = k => `shoptrack_${k}`;
const load = (k, d) => { try { const v = localStorage.getItem(LSK(k)); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(LSK(k), JSON.stringify(v)); } catch(e) { alert('儲存失敗'); } };

let state = {
  screen: 'login',
  nick: '',
  orders: load('orders', []),
  clients: load('clients', []),
  wallets: load('wallets', {}),
  tab: 'orders'
};

function saveState() {
  save('orders', state.orders);
  save('clients', state.clients);
  save('wallets', state.wallets);
}

function productPrice(p, level) {
  if (p.rateType === 'gacha') {
    const prices = [{jpy:200,twd:60},{jpy:300,twd:80},{jpy:400,twd:110},{jpy:500,twd:140}];
    const r = prices.find(x => x.jpy === +p.price);
    return (r ? r.twd : Math.round(p.price * 0.275)) + (p.keepShell ? 5 : 0);
  }
  if (p.rateType === 'ticket') return Math.ceil(p.price * (level ? level.ticketRate : 0.295));
  if (p.rateType === 'souvenir') return Math.ceil(p.price * (level ? level.souvenirRate : 0.285));
  return Math.ceil(p.price * 0.275);
}

function getMemberLevel(dep) {
  if (dep >= 6000) return {name:"鑽石優惠",cashback:0.02,ticketRate:0.285,souvenirRate:0.275,icon:"💎"};
  if (dep >= 4000) return {name:"黃金優惠",cashback:0.01,ticketRate:0.285,souvenirRate:0.285,icon:"🥇"};
  if (dep >= 2000) return {name:"銀牌優惠",cashback:0.01,ticketRate:0.295,souvenirRate:0.285,icon:"🥈"};
  return {name:"無優惠",cashback:0,ticketRate:0.295,souvenirRate:0.285,icon:"👤"};
}

function render() {
  const app = document.getElementById('app');
  
  if (state.screen === 'login') {
    app.innerHTML = `
      <div class="container center" style="padding-top: 80px;">
        <div style="font-size: 48px; margin-bottom: 20px;">🛍️</div>
        <h1 style="margin-bottom: 40px;">ShopTrack</h1>
        <button class="btn btn-primary" onclick="state.screen='agent';render();">👑 闆闆登入</button>
        <button class="btn btn-secondary" onclick="state.screen='client-login';render();">👤 客人登入</button>
      </div>
    `;
  }
  
  else if (state.screen === 'client-login') {
    app.innerHTML = `
      <div class="container center" style="padding-top: 60px;">
        <h2 style="margin-bottom: 30px;">客人登入</h2>
        <input id="cname" placeholder="輸入你的名字" />
        <button class="btn btn-primary" onclick="loginClient()">進入</button>
        <button class="btn btn-secondary" onclick="state.screen='login';render();">返回</button>
      </div>
    `;
    setTimeout(() => document.getElementById('cname').focus(), 100);
  }
  
  else if (state.screen === 'client') {
    const c = state.clients.find(x => x.name === state.nick);
    const w = state.wallets[c?.clientCode] || {balance: 0, logs: []};
    const myOrders = state.orders.filter(o => o.clientName === state.nick);
    const totalDep = (w.logs || []).filter(l => l.type === 'add').reduce((s,l) => s+l.amount, 0);
    const level = getMemberLevel(totalDep);
    
    let html = `<div class="container">`;
    html += `<div style="display: flex; justify-content: space-between; margin-bottom: 16px;"><h2>${state.nick}</h2><button class="btn" style="width: 60px; padding: 6px;" onclick="state.screen='login';render();">登出</button></div>`;
    
    if (myOrders.length > 0) {
      const total = myOrders.reduce((s,o) => s + productPrice(o, level), 0);
      html += `<div class="card" style="background: #fff8f0;">`;
      html += `<div style="display: flex; justify-content: space-between; margin-bottom: 8px;"><span>📦 商品合計</span><span style="font-weight: bold;">NT$${total.toLocaleString()}</span></div>`;
      html += `<div style="display: flex; justify-content: space-between;"><span>${level.icon} ${level.name}</span><span style="font-weight: bold;">購物金: NT$${w.balance}</span></div>`;
      html += `</div>`;
    }
    
    html += `<div class="card"><h3>訂單 (${myOrders.length})</h3>`;
    if (myOrders.length === 0) {
      html += `<div style="text-align: center; color: #999; padding: 20px;">還沒有訂單</div>`;
    } else {
      myOrders.forEach(o => {
        const price = productPrice(o, level);
        html += `<div style="padding: 10px; background: #fffaf5; border-radius: 8px; margin-top: 8px;">`;
        html += `<div><strong>${o.item}</strong></div>`;
        html += `<div style="font-size: 12px; color: #666;">NT$${price}</div>`;
        html += `</div>`;
      });
    }
    html += `</div>`;
    html += `</div>`;
    
    app.innerHTML = html;
  }
  
  else if (state.screen === 'agent') {
    let html = `<div class="container">`;
    html += `<div style="display: flex; justify-content: space-between; margin-bottom: 16px;"><h2>👑 業者</h2><button class="btn" style="width: 60px; padding: 6px;" onclick="state.screen='login';render();">登出</button></div>`;
    
    if (state.tab === 'orders') {
      html += `<div class="card"><h3>訂單 (${state.orders.length})</h3>`;
      if (state.orders.length === 0) {
        html += `<div style="text-align: center; color: #999; padding: 20px;">沒有訂單</div>`;
      } else {
        state.orders.forEach(o => {
          html += `<div style="padding: 10px; background: #fffaf5; border-radius: 8px; margin-top: 8px;">`;
          html += `<div><strong>${o.clientName} - ${o.item}</strong></div>`;
          html += `<div style="font-size: 12px; color: #666;">${o.price}</div>`;
          html += `</div>`;
        });
      }
      html += `</div>`;
    }
    
    if (state.tab === 'clients') {
      html += `<div class="card"><h3>客人 (${state.clients.length})</h3>`;
      if (state.clients.length === 0) {
        html += `<div style="text-align: center; color: #999; padding: 20px;">沒有客人</div>`;
      } else {
        state.clients.forEach(c => {
          html += `<div style="padding: 10px; background: #fffaf5; border-radius: 8px; margin-top: 8px;"><strong>${c.name}</strong></div>`;
        });
      }
      html += `<button class="btn btn-primary" style="margin-top: 12px;" onclick="addClient()">+ 新增客人</button>`;
      html += `</div>`;
    }
    
    if (state.tab === 'settings') {
      html += `<div class="card">`;
      html += `<h3>⚙️ 設定</h3>`;
      html += `<div style="color: #666; font-size: 12px; margin-bottom: 12px;">`;
      html += `<div>✅ 一般商品: 0.275</div>`;
      html += `<div>✅ 門票商品: 0.295</div>`;
      html += `<div>✅ 土產/大型: 0.285</div>`;
      html += `</div>`;
      html += `<button class="btn" style="background: #fee2e2; color: #dc2626;" onclick="if(confirm('確定清除所有訂單?')){state.orders=[];saveState();render();}">🗑️ 清除所有訂單</button>`;
      html += `</div>`;
    }
    
    html += `<div style="display: flex; gap: 8px; margin-top: 20px; background: #fffaf5; padding: 8px; border-radius: 12px;">`;
    html += `<button class="btn" style="background: ${state.tab==='orders'?'#c8756a':'transparent'}; color: ${state.tab==='orders'?'white':'#8a6a5a'}; padding: 10px;" onclick="state.tab='orders';render();">📋</button>`;
    html += `<button class="btn" style="background: ${state.tab==='clients'?'#c8756a':'transparent'}; color: ${state.tab==='clients'?'white':'#8a6a5a'}; padding: 10px;" onclick="state.tab='clients';render();">👤</button>`;
    html += `<button class="btn" style="background: ${state.tab==='settings'?'#c8756a':'transparent'}; color: ${state.tab==='settings'?'white':'#8a6a5a'}; padding: 10px;" onclick="state.tab='settings';render();">⚙️</button>`;
    html += `</div>`;
    html += `</div>`;
    
    app.innerHTML = html;
  }
}

function loginClient() {
  const name = document.getElementById('cname').value.trim();
  if (!name) { alert('請輸入名字'); return; }
  const c = state.clients.find(x => x.name === name);
  if (!c) { alert('找不到此客人'); return; }
  state.nick = name;
  state.screen = 'client';
  render();
}

function addClient() {
  const name = prompt('客人名字:');
  if (!name) return;
  const code = `C${Date.now()}`;
  state.clients.push({name, clientCode: code});
  state.wallets[code] = {balance: 0, logs: []};
  saveState();
  render();
}

render();
</script>
</body>
</html>
