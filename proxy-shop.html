<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopTrack 代購管理系統</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#faf8f5;color:#2d1f1a;}
    .container{max-width:500px;margin:0 auto;padding:12px;min-height:100vh;}
    .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
    .btn{padding:12px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;font-family:"Microsoft JhengHei";}
    .btn-primary{background:linear-gradient(135deg,#7cb87a,#9ed09c);color:#fff;}
    .IS{padding:10px 12px;border:1.5px solid #d0c0b8;border-radius:10px;background:#fff;font-size:14px;font-family:"Microsoft JhengHei";}
    .chip{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
    .modal-content{background:#fff;border-radius:16px;padding:20px;max-width:480px;max-height:90vh;overflow-y:auto;}
    input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0;font-size:14px;font-family:"Microsoft JhengHei";}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const RATE_TYPES={general:{label:"一般商品",rate:0.275},ticket:{label:"門票商品",rate:0.295},souvenir:{label:"土產/大型",rate:0.285},gacha:{label:"扭蛋",rate:null}};
const MEMBER_LEVELS=[{name:"鑽石優惠",minDeposit:6000,cashback:0.02,ticketRate:0.285,souvenirRate:0.275,icon:"💎"},{name:"黃金優惠",minDeposit:4000,cashback:0.01,ticketRate:0.285,souvenirRate:0.285,icon:"🥇"},{name:"銀牌優惠",minDeposit:2000,cashback:0.01,ticketRate:0.295,souvenirRate:0.285,icon:"🥈"},{name:"無優惠",minDeposit:0,cashback:0,ticketRate:0.295,souvenirRate:0.285,icon:"👤"}];
function getMemberLevel(dep){return MEMBER_LEVELS.find(l=>dep>=l.minDeposit)||MEMBER_LEVELS[3];}
function productPrice(p,level){if(p.rateType==="gacha"){const prices=[{jpy:200,twd:60},{jpy:300,twd:80},{jpy:400,twd:110},{jpy:500,twd:140}];const r=prices.find(x=>x.jpy===+p.price);return(r?r.twd:Math.round(p.price*0.275))+(p.keepShell?5:0);}if(p.rateType==="ticket")return Math.ceil(p.price*(level?level.ticketRate:0.295));if(p.rateType==="souvenir")return Math.ceil(p.price*(level?level.souvenirRate:0.285));return Math.ceil(p.price*0.275);}
const LSK=k=>`shoptrack_${k}`;
function load(k,d){try{const v=localStorage.getItem(LSK(k));return v?JSON.parse(v):d;}catch{return d;}}
function save(k,v){try{localStorage.setItem(LSK(k),JSON.stringify(v));}catch(e){}}

function App(){
  const [isAgent,setIsAgent]=React.useState(null);
  const [nick,setNick]=React.useState("");
  const [orders,setOrders]=React.useState(()=>load("orders",[]));
  const [clients,setClients]=React.useState(()=>load("clients",[]));
  const [products,setProducts]=React.useState(()=>load("products",[]));
  const [wallets,setWallets]=React.useState(()=>load("wallets",{}));
  const [modal,setModal]=React.useState(null);

  React.useEffect(()=>{save("orders",orders);save("clients",clients);save("products",products);save("wallets",wallets);},[orders,clients,products,wallets]);

  if(isAgent===null){
    return(
      <div className="container"style={{display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",height:"100vh"}}>
        <div style={{fontSize:48,marginBottom:20}}>🛍️</div>
        <div style={{fontSize:28,fontWeight:900,marginBottom:30,textAlign:"center",color:"#c8756a"}}>ShopTrack<br/>代購管理系統</div>
        <button onClick={()=>setIsAgent(true)}className="btn btn-primary"style={{width:"100%",marginBottom:10}}>👑 闆闆登入</button>
        <button onClick={()=>setIsAgent(false)}className="btn"style={{width:"100%",background:"#f0fdf4",color:"#166534",fontWeight:700}}>👤 客人登入</button>
      </div>
    );
  }

  if(isAgent){
    return<AgentView{...{orders,setOrders,clients,setClients,products,setProducts,wallets,setWallets,setIsAgent,modal,setModal}}/>;
  }else{
    return<ClientView{...{nick,setNick,clients,orders,products,wallets,setWallets,setIsAgent}}/>;
  }
}

function ClientView({nick,setNick,clients,orders,products,wallets,setWallets,setIsAgent}){
  if(!nick){
    return(
      <div className="container"style={{paddingTop:100,textAlign:"center"}}>
        <h2style={{marginBottom:30}}>客人登入</h2>
        <input className="IS"placeholder="輸入你的名字"value={nick}onChange={e=>setNick(e.target.value)}style={{width:"100%"}}/>
        <button className="btn btn-primary"style={{width:"100%"}}onClick={()=>{const c=clients.find(x=>x.name===nick);if(!c){alert("找不到此客人");return;}}}>進入</button>
        <button className="btn"style={{width:"100%",background:"#f5f5f5",marginTop:10}}onClick={()=>setIsAgent(null)}>返回</button>
      </div>
    );
  }
  const c=clients.find(x=>x.name===nick);
  if(!c){return<div className="container"style={{paddingTop:100,textAlign:"center"}}>❌ 找不到客人</div>;}
  const w=wallets[c.clientCode]||{balance:0,logs:[]};
  const myOrders=orders.filter(o=>o.clientName===nick);
  const totalDep=(w.logs||[]).filter(l=>l.type==="add").reduce((s,l)=>s+l.amount,0);
  const level=getMemberLevel(totalDep);
  const total=myOrders.reduce((s,o)=>s+productPrice({...o,rateType:o.rateType||"general"},level),0);
  const cashback=level.cashback>0?Math.ceil(myOrders.filter(o=>o.rateType!=="gacha").reduce((s,o)=>s+productPrice({...o,rateType:o.rateType||"general"},level),0)*level.cashback):0;
  const finalTotal=total-cashback;
  
  return(
    <div className="container">
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:16,paddingTop:12}}>
        <h2>{nick}</h2>
        <button className="btn"style={{padding:"6px 12px",background:"#f5f5f5",fontSize:12,width:"auto"}}onClick={()=>{setNick("");setIsAgent(null);}}>登出</button>
      </div>
      {myOrders.length>0&&(<div style={{background:"linear-gradient(135deg,#fff8f0,#fde8d8)",borderRadius:16,padding:"14px 16px",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6}}>
          <span>📦 商品合計</span><span style={{fontWeight:700}}>NT${total.toLocaleString()}</span>
        </div>
        {cashback>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6}}>
          <span style={{color:"#22c55e",fontWeight:700}}>{level.icon} 會員回饋</span><span style={{color:"#22c55e",fontWeight:700}}>-NT${cashback}</span>
        </div>}
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,paddingTop:6,borderTop:"1px solid #f0d9cc"}}>
          <span>小計</span><span style={{fontWeight:700}}>NT${finalTotal.toLocaleString()}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginTop:6}}>
          <span>💰 購物金</span><span style={{fontWeight:700}}>NT${w.balance}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginTop:6,paddingTop:6,borderTop:"1px solid #f0d9cc"}}>
          <span style={{fontWeight:900}}>應付</span><span style={{fontWeight:900,color:"#e11d48",fontSize:16}}>NT${Math.max(0,finalTotal-w.balance)}</span>
        </div>
      </div>)}
      <div className="card"><h3>訂單 ({myOrders.length})</h3>
        {myOrders.length===0?<div style={{color:"#999",textAlign:"center",padding:20}}>還沒有訂單</div>:myOrders.map(o=>{
          const price=productPrice({...o,rateType:o.rateType||"general"},level);
          const cb=o.rateType!=="gacha"&&level.cashback>0?Math.ceil(price*level.cashback):0;
          return(
            <div key={o.id}style={{padding:10,background:"#fffaf5",borderRadius:8,marginTop:8}}>
              <div><strong>{o.item}</strong></div>
              <div style={{fontSize:12,color:"#666"}}>NT${price} {cb>0?` | 回饋-${cb}`:""} | {o.status}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AgentView({orders,setOrders,clients,setClients,products,setProducts,wallets,setWallets,setIsAgent,modal,setModal}){
  const [tab,setTab]=React.useState("orders");
  
  const showModal=(content)=>setModal(content);
  const closeModal=()=>setModal(null);
  
  return(
    <div className="container">
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:16,paddingTop:12}}>
        <h2>👑 業者後台</h2>
        <button className="btn"style={{padding:"6px 12px",background:"#f5f5f5",fontSize:12,width:"auto"}}onClick={()=>setIsAgent(null)}>登出</button>
      </div>

      {tab==="orders"&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <h3>訂單 ({orders.length})</h3>
            <button className="btn btn-primary"style={{width:"auto",padding:"8px 12px",fontSize:12}}onClick={()=>showModal("add-order")}>+ 新增</button>
          </div>
          {orders.length===0?<div className="card">沒有訂單</div>:orders.map(o=>(
            <div key={o.id}className="card">
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <div><strong>{o.clientName} - {o.item}</strong></div>
                <button className="btn"style={{width:"auto",padding:"4px 8px",fontSize:11}}onClick={()=>setModal({type:"edit-order",data:o})}>編輯</button>
              </div>
              <div style={{fontSize:12,color:"#666"}}>¥{o.price} → NT${productPrice(o,{})} | {o.status}</div>
            </div>
          ))}
        </div>
      )}

      {tab==="products"&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <h3>商品 ({products.length})</h3>
            <button className="btn btn-primary"style={{width:"auto",padding:"8px 12px",fontSize:12}}onClick={()=>showModal("add-product")}>+ 新增</button>
          </div>
          {products.length===0?<div className="card">沒有商品</div>:products.map(p=>(
            <div key={p.id}className="card"style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><strong>{p.name}</strong><br/><span style={{fontSize:12,color:"#666"}}>¥{p.price} → NT${productPrice(p,{})}</span></div>
              <div style={{display:"flex",gap:4}}>
                <button className="btn"style={{width:"auto",padding:"4px 8px",fontSize:11}}onClick={()=>setModal({type:"edit-product",data:p})}>編輯</button>
                <button className="btn"style={{width:"auto",padding:"4px 8px",fontSize:11,background:"#fee2e2",color:"#dc2626"}}onClick={()=>{if(confirm("刪除?")){setProducts(products.filter(x=>x.id!==p.id))}}}>刪</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {tab==="clients"&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <h3>客人 ({clients.length})</h3>
            <button className="btn btn-primary"style={{width:"auto",padding:"8px 12px",fontSize:12}}onClick={()=>showModal("add-client")}>+ 新增</button>
          </div>
          {clients.length===0?<div className="card">沒有客人</div>:clients.map(c=>{
            const w=wallets[c.clientCode]||{balance:0};
            return(
              <div key={c.clientCode}className="card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div><strong>{c.name}</strong><br/><span style={{fontSize:12,color:"#666"}}>購物金: NT${w.balance}</span></div>
                  <button className="btn"style={{width:"auto",padding:"6px 10px",fontSize:12}}onClick={()=>setModal({type:"wallet",data:c.clientCode})}>管理</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{display:"flex",gap:8,marginTop:20,background:"#fffaf5",borderRadius:12,padding:8}}>
        {[{k:"orders",l:"📋"},{k:"products",l:"📦"},{k:"clients",l:"👤"}].map(t=>(
          <button key={t.k}className="btn"style={{flex:1,background:tab===t.k?"#c8756a":"transparent",color:tab===t.k?"#fff":"#8a6a5a",fontWeight:700}}onClick={()=>setTab(t.k)}>{t.l}</button>
        ))}
      </div>

      {modal&&<ModalComponent{...{modal,setModal:closeModal,orders,setOrders,clients,setClients,products,setProducts,wallets,setWallets}}/>}
    </div>
  );
}

function ModalComponent({modal,setModal,orders,setOrders,clients,setClients,products,setProducts,wallets,setWallets}){
  if(typeof modal==="string"){
    if(modal==="add-product"){
      return<ProductModal onClose={setModal}onSave={(p)=>{setProducts([...products,{...p,id:'P'+Date.now()}]);setModal(null);}}/>
    }
    if(modal==="add-order"){
      return<OrderModal clients={clients}products={products}onClose={setModal}onSave={(o)=>{setOrders([...orders,{...o,id:'O'+Date.now()}]);setModal(null);}}/>
    }
    if(modal==="add-client"){
      return<ClientModal onClose={setModal}onSave={(c)=>{const code=`C${Date.now()}`;setClients([...clients,{name:c,clientCode:code}]);setWallets({...wallets,[code]:{balance:0,logs:[]}});setModal(null);}}/>
    }
  }
  if(modal.type==="edit-product"){
    return<ProductModal product={modal.data}onClose={setModal}onSave={(p)=>{setProducts(products.map(x=>x.id===p.id?p:x));setModal(null);}}/>
  }
  if(modal.type==="edit-order"){
    return<OrderModal order={modal.data}onClose={setModal}onSave={(o)=>{setOrders(orders.map(x=>x.id===o.id?o:x));setModal(null);}}/>
  }
  if(modal.type==="wallet"){
    return<WalletModal clientCode={modal.data}wallets={wallets}setWallets={setWallets}clients={clients}onClose={setModal}/>
  }
}

function ProductModal({product,onClose,onSave}){
  const [form,setForm]=React.useState(product||{name:"",price:"",rateType:"general"});
  return(
    <div className="modal">
      <div className="modal-content">
        <h3>{product?"編輯":"新增"}商品</h3>
        <input placeholder="商品名稱"value={form.name}onChange={e=>setForm({...form,name:e.target.value})}/>
        <input placeholder="日幣價格"type="number"value={form.price}onChange={e=>setForm({...form,price:e.target.value})}/>
        <select value={form.rateType}onChange={e=>setForm({...form,rateType:e.target.value})}>
          <option value="general">一般商品 (0.275)</option>
          <option value="ticket">門票商品 (0.295)</option>
          <option value="souvenir">土產/大型 (0.285)</option>
          <option value="gacha">扭蛋</option>
        </select>
        <button className="btn btn-primary"onClick={()=>onSave(form)}>儲存</button>
        <button className="btn"style={{background:"#f5f5f5"}}onClick={()=>onClose(null)}>取消</button>
      </div>
    </div>
  );
}

function OrderModal({order,clients,products,onClose,onSave}){
  const [form,setForm]=React.useState(order||{clientCode:"",productId:"",price:"",status:"pending"});
  return(
    <div className="modal">
      <div className="modal-content">
        <h3>{order?"編輯":"新增"}訂單</h3>
        {!order&&(
          <>
            <select value={form.clientCode}onChange={e=>setForm({...form,clientCode:e.target.value})}>
              <option value="">選擇客人</option>
              {clients.map(c=><option key={c.clientCode}value={c.clientCode}>{c.name}</option>)}
            </select>
            <select value={form.productId}onChange={e=>setForm({...form,productId:e.target.value})}>
              <option value="">選擇商品</option>
              {products.map(p=><option key={p.id}value={p.id}>{p.name}</option>)}
            </select>
          </>
        )}
        {!order&&<input placeholder="日幣價格"type="number"value={form.price}onChange={e=>setForm({...form,price:e.target.value})}/>}
        <select value={form.status}onChange={e=>setForm({...form,status:e.target.value})}>
          <option value="pending">待購買</option>
          <option value="bought">已買到</option>
          <option value="completed">已完成</option>
        </select>
        <button className="btn btn-primary"onClick={()=>onSave(form)}>儲存</button>
        <button className="btn"style={{background:"#f5f5f5"}}onClick={()=>onClose(null)}>取消</button>
      </div>
    </div>
  );
}

function ClientModal({onClose,onSave}){
  const [name,setName]=React.useState("");
  return(
    <div className="modal">
      <div className="modal-content">
        <h3>新增客人</h3>
        <input placeholder="客人名字"value={name}onChange={e=>setName(e.target.value)}/>
        <button className="btn btn-primary"onClick={()=>onSave(name)}>新增</button>
        <button className="btn"style={{background:"#f5f5f5"}}onClick={()=>onClose(null)}>取消</button>
      </div>
    </div>
  );
}

function WalletModal({clientCode,wallets,setWallets,clients,onClose}){
  const c=clients.find(x=>x.clientCode===clientCode);
  const w=wallets[clientCode]||{balance:0,logs:[]};
  const [amount,setAmount]=React.useState("");
  return(
    <div className="modal">
      <div className="modal-content">
        <h3>💰 {c.name} 購物金</h3>
        <div style={{padding:12,background:"#fffaf5",borderRadius:8,marginBottom:12}}>
          <div>現有餘額: <strong style={{fontSize:18,color:"#c8756a"}}>NT${w.balance}</strong></div>
        </div>
        <input placeholder="輸入金額"type="number"value={amount}onChange={e=>setAmount(e.target.value)}/>
        <button className="btn btn-primary"onClick={()=>{const a=+amount;if(a){const nw={...w,balance:(w.balance||0)+a,logs:[...(w.logs||[]),{type:"add",amount:a,date:new Date().toLocaleDateString('zh-TW')}]};setWallets({...wallets,[clientCode]:nw});setAmount("");}}}>+ 儲值</button>
        <button className="btn"style={{background:"#f5f5f5"}}onClick={()=>{const a=+amount;if(a){const nw={...w,balance:(w.balance||0)-a,logs:[...(w.logs||[]),{type:"deduct",amount:a,date:new Date().toLocaleDateString('zh-TW')}]};setWallets({...wallets,[clientCode]:nw});setAmount("");}}}>- 扣款</button>
        <button className="btn"style={{background:"#f5f5f5"}}onClick={()=>onClose()}>關閉</button>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
