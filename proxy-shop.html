<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopTrack</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft JhengHei', sans-serif; background: #faf8f5; color: #2d1f1a; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .btn { padding: 12px 16px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .btn-primary { background: linear-gradient(135deg, #7cb87a, #9ed09c); color: white; }
    input, select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 14px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const LSK = k => `shoptrack_${k}`;
const load = (k, d) => { try { const v = localStorage.getItem(LSK(k)); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(LSK(k), JSON.stringify(v)); } catch(e) { console.log(e); } };

function App() {
  const [screen, setScreen] = useState('login');
  const [nick, setNick] = useState('');
  const [orders, setOrders] = useState(() => load('orders', []));
  const [clients, setClients] = useState(() => load('clients', []));
  const [wallets, setWallets] = useState(() => load('wallets', {}));

  useEffect(() => {
    save('orders', orders);
    save('clients', clients);
    save('wallets', wallets);
  }, [orders, clients, wallets]);

  const [msg, setMsg] = useState('');
  const toast = (m) => { setMsg(m); setTimeout(() => setMsg(''), 2000); };

  if (screen === 'login') {
    return (
      <div className="container" style={{textAlign: 'center', paddingTop: 100}}>
        <div style={{fontSize: 48, marginBottom: 20}}>🛍️</div>
        <h1 style={{marginBottom: 40}}>ShopTrack</h1>
        <button className="btn btn-primary" style={{width: 200, marginBottom: 10}} onClick={() => setScreen('agent')}>
          👑 闆闆登入
        </button>
        <button className="btn" style={{width: 200, background: '#f0fdf4', color: '#166534'}} onClick={() => setScreen('client-login')}>
          👤 客人登入
        </button>
      </div>
    );
  }

  if (screen === 'client-login') {
    return (
      <div className="container" style={{paddingTop: 100}}>
        <div style={{textAlign: 'center'}}>
          <h2 style={{marginBottom: 30}}>客人登入</h2>
          <input placeholder="輸入名字" value={nick} onChange={e => setNick(e.target.value)} style={{width: '100%', marginBottom: 10}} />
          <button className="btn btn-primary" style={{width: '100%', marginBottom: 10}} onClick={() => {
            const c = clients.find(x => x.name === nick);
            if (!c) { toast('找不到客人'); return; }
            setScreen('client');
          }}>進入</button>
          <button className="btn" style={{width: '100%', background: '#f5f5f5'}} onClick={() => setScreen('login')}>返回</button>
          {msg && <div style={{marginTop: 10, color: 'red'}}>{msg}</div>}
        </div>
      </div>
    );
  }

  if (screen === 'client') {
    const c = clients.find(x => x.name === nick);
    const w = wallets[c?.clientCode] || {balance: 0};
    const myOrders = orders.filter(o => o.clientName === nick);
    
    return (
      <div className="container">
        <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 16}}>
          <h2>{nick}</h2>
          <button className="btn" style={{padding: '6px 12px', background: '#f5f5f5'}} onClick={() => {
            setNick('');
            setScreen('login');
          }}>登出</button>
        </div>

        <div className="card">
          <h3>訂單 ({myOrders.length})</h3>
          {myOrders.length === 0 ? (
            <div style={{color: '#999', textAlign: 'center', padding: 20}}>還沒有訂單</div>
          ) : (
            myOrders.map(o => (
              <div key={o.id} style={{padding: 10, background: '#fffaf5', borderRadius: 8, marginTop: 8}}>
                <div>{o.item}</div>
                <div style={{fontSize: 12, color: '#666'}}>NT${o.price}</div>
              </div>
            ))
          )}
        </div>

        <div className="card">
          <h3>購物金</h3>
          <div style={{fontSize: 18, fontWeight: 'bold'}}>NT${w.balance}</div>
        </div>
      </div>
    );
  }

  if (screen === 'agent') {
    const [tab, setTab] = useState('orders');

    return (
      <div className="container">
        <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 16}}>
          <h2>👑 業者後台</h2>
          <button className="btn" style={{padding: '6px 12px', background: '#f5f5f5'}} onClick={() => setScreen('login')}>登出</button>
        </div>

        {tab === 'orders' && (
          <div>
            <h3 style={{marginBottom: 12}}>訂單 ({orders.length})</h3>
            {orders.length === 0 ? (
              <div style={{textAlign: 'center', padding: 20, color: '#999'}}>沒有訂單</div>
            ) : (
              orders.map(o => (
                <div key={o.id} className="card">
                  <div>{o.clientName} - {o.item}</div>
                  <div style={{fontSize: 12, color: '#666'}}>{o.price}</div>
                </div>
              ))
            )}
          </div>
        )}

        {tab === 'clients' && (
          <div>
            <h3 style={{marginBottom: 12}}>客人 ({clients.length})</h3>
            {clients.map(c => (
              <div key={c.clientCode} className="card">
                <div>{c.name}</div>
              </div>
            ))}
            <button className="btn btn-primary" style={{width: '100%'}} onClick={() => {
              const name = prompt('客人名字');
              if (!name) return;
              const code = `C${Date.now()}`;
              setClients([...clients, {name, clientCode: code}]);
              setWallets({...wallets, [code]: {balance: 0}});
              toast('已新增客人');
            }}>+ 新增客人</button>
          </div>
        )}

        {tab === 'settings' && (
          <div>
            <h3 style={{marginBottom: 12}}>⚙️ 設定</h3>
            <div className="card">
              <div style={{marginBottom: 12}}>匯率已更新：</div>
              <div style={{fontSize: 12, color: '#666', marginBottom: 12}}>
                <div>一般商品: 0.275</div>
                <div>門票商品: 0.295</div>
                <div>土產/大型: 0.285</div>
              </div>
              <button className="btn" style={{width: '100%', background: '#fee2e2', color: '#dc2626'}} onClick={() => {
                if (window.confirm('確定清除所有訂單?')) {
                  setOrders([]);
                  toast('已清除訂單');
                }
              }}>🗑️ 清除所有訂單</button>
            </div>
          </div>
        )}

        <div style={{display: 'flex', gap: 8, marginTop: 20, background: '#fffaf5', borderRadius: 12, padding: 8}}>
          <button className="tap" onClick={() => setTab('orders')} style={{flex: 1, padding: 10, borderRadius: 10, border: 'none', background: tab === 'orders' ? '#c8756a' : 'transparent', color: tab === 'orders' ? 'white' : '#8a6a5a', fontWeight: 700}}>📋</button>
          <button className="tap" onClick={() => setTab('clients')} style={{flex: 1, padding: 10, borderRadius: 10, border: 'none', background: tab === 'clients' ? '#c8756a' : 'transparent', color: tab === 'clients' ? 'white' : '#8a6a5a', fontWeight: 700}}>👤</button>
          <button className="tap" onClick={() => setTab('settings')} style={{flex: 1, padding: 10, borderRadius: 10, border: 'none', background: tab === 'settings' ? '#c8756a' : 'transparent', color: tab === 'settings' ? 'white' : '#8a6a5a', fontWeight: 700}}>⚙️</button>
        </div>
      </div>
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
