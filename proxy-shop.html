<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopTrack 代購管理系統</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#faf8f5;color:#2d1f1a;}
    .container{max-width:500px;margin:0 auto;padding:12px;min-height:100vh;}
    .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
    .btn{padding:12px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;}
    .btn-primary{background:linear-gradient(135deg,#7cb87a,#9ed09c);color:#fff;width:100%;margin:8px 0;}
    .btn-secondary{background:#f5f5f5;color:#666;width:100%;margin:8px 0;}
    .btn-small{padding:6px 10px;width:auto;font-size:12px;margin:2px;}
    input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0;font-size:14px;font-family:inherit;}
    textarea{resize:vertical;min-height:60px;}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;overflow-y:auto;}
    .modal.hide{display:none;}
    .modal-content{background:#fff;border-radius:16px;padding:20px;margin:20px auto;max-width:480px;width:90%;}
    .tabs{display:flex;gap:8px;margin:12px 0;background:#fffaf5;padding:8px;border-radius:12px;overflow-x:auto;}
    .tab-btn{flex-shrink:0;padding:10px;border:none;border-radius:10px;cursor:pointer;font-weight:700;background:transparent;color:#8a6a5a;font-family:inherit;font-size:13px;}
    .tab-btn.active{background:#c8756a;color:#fff;}
    .order-detail{padding:12px;background:#fffaf5;border-radius:8px;margin-top:8px;border-left:4px solid #c8756a;}
    .detail-row{display:flex;justify-content:space-between;font-size:13px;margin:4px 0;}
    .summary-box{background:linear-gradient(135deg,#fff8f0,#fde8d8);border-radius:12px;padding:12px;margin:8px 0;}
    .summary-row{display:flex;justify-content:space-between;font-size:13px;margin:6px 0;align-items:center;}
  </style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hide"><div class="modal-content" id="modal-body"></div></div>

<script>
const LSK=k=>`shoptrack_${k}`;
const load=(k,d)=>{try{const v=localStorage.getItem(LSK(k));return v?JSON.parse(v):d;}catch{return d;}};
const save=(k,v)=>{try{localStorage.setItem(LSK(k),JSON.stringify(v));}catch(e){alert('儲存失敗');}};

let state={screen:'login',nick:'',orders:load('orders',[]),clients:load('clients',[]),products:load('products',[]),wallets:load('wallets',{}),tab:'orders'};
const AGENT_PASSWORD='12345';

function saveState(){save('orders',state.orders);save('clients',state.clients);save('products',state.products);save('wallets',state.wallets);}

function getMemberLevel(dep){if(dep>=6000)return{name:"鑽石優惠",cashback:0.02,ticketRate:0.285,souvenirRate:0.275,icon:"💎"};if(dep>=4000)return{name:"黃金優惠",cashback:0.01,ticketRate:0.285,souvenirRate:0.285,icon:"🥇"};if(dep>=2000)return{name:"銀牌優惠",cashback:0.01,ticketRate:0.295,souvenirRate:0.285,icon:"🥈"};return{name:"無優惠",cashback:0,ticketRate:0.295,souvenirRate:0.285,icon:"👤"};}

function productPrice(p,level){if(!p||!p.rateType)return 0;if(p.rateType==='gacha'){const prices=[{jpy:200,twd:60},{jpy:300,twd:80},{jpy:400,twd:110},{jpy:500,twd:140}];const r=prices.find(x=>x.jpy===+p.price);return(r?r.twd:Math.round(p.price*0.275))+(p.keepShell?5:0);}if(p.rateType==='ticket')return Math.ceil(p.price*(level?level.ticketRate:0.295));if(p.rateType==='souvenir')return Math.ceil(p.price*(level?level.souvenirRate:0.285));return Math.ceil(p.price*0.275);}

function openModal(html){document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').classList.remove('hide');}
function closeModal(){document.getElementById('modal').classList.add('hide');}

function render(){const app=document.getElementById('app');if(state.screen==='login'){app.innerHTML=`<div class="container" style="text-align:center;padding-top:80px;"><div style="font-size:48px;margin-bottom:20px;">🛍️</div><h1 style="margin-bottom:40px;">ShopTrack</h1><button class="btn btn-primary" onclick="state.screen='agent-login';render();">👑 闆闆登入</button><button class="btn btn-secondary" onclick="state.screen='client-login';render();">👤 客人登入</button></div>`;}else if(state.screen==='agent-login'){app.innerHTML=`<div class="container" style="text-align:center;padding-top:60px;"><h2 style="margin-bottom:30px;">闆闆登入</h2><input id="pwd" type="password" placeholder="輸入密碼"/><button class="btn btn-primary" onclick="loginAgent()">進入</button><button class="btn btn-secondary" onclick="state.screen='login';render();">返回</button></div>`;setTimeout(()=>document.getElementById('pwd')?.focus(),100);}else if(state.screen==='client-login'){app.innerHTML=`<div class="container" style="text-align:center;padding-top:60px;"><h2 style="margin-bottom:30px;">客人登入</h2><input id="cname" placeholder="輸入你的名字"/><button class="btn btn-primary" onclick="loginClient()">進入</button><button class="btn btn-secondary" onclick="state.screen='login';render();">返回</button></div>`;setTimeout(()=>document.getElementById('cname')?.focus(),100);}else if(state.screen==='client'){const c=state.clients.find(x=>x.name===state.nick);const w=state.wallets[c?.clientCode]||{balance:0,paid:0,logs:[]};const myOrders=state.orders.filter(o=>o.clientName===state.nick);const totalDep=(w.logs||[]).filter(l=>l.type==='add').reduce((s,l)=>s+l.amount,0);const level=getMemberLevel(totalDep);let html=`<div class="container"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><h2>${state.nick}</h2><button class="btn btn-secondary btn-small" onclick="state.screen='login';render();">登出</button></div>`;const total=myOrders.reduce((s,o)=>s+productPrice(o,level),0);const cashback=level.cashback>0?Math.ceil(myOrders.filter(o=>o.rateType!=='gacha').reduce((s,o)=>s+productPrice(o,level),0)*level.cashback):0;const finalTotal=total-cashback;const needToPay=Math.max(0,finalTotal-w.balance);const unpaid=Math.max(0,needToPay-w.paid);html+=`<div class="card"><div style="padding:8px;background:#f0f8ff;border-radius:8px;margin-bottom:12px;text-align:center;"><span style="font-weight:700;">${level.icon} ${level.name}</span><br/><span style="font-size:11px;color:#666;">儲值:NT$${totalDep}</span></div><div class="summary-box"><div class="summary-row"><span>📦 商品合計</span><span style="font-weight:700;">NT$${total}</span></div>`;if(cashback>0){html+=`<div class="summary-row"><span style="color:#22c55e;font-weight:700;">${level.icon} 會員回饋</span><span style="color:#22c55e;font-weight:700;">-NT$${cashback}</span></div>`;}html+=`<div class="summary-row" style="padding-top:8px;border-top:1px solid #f0d9cc;margin-top:8px;"><span>小計</span><span style="font-weight:700;">NT$${finalTotal}</span></div><div class="summary-row"><span>💰 購物金</span><span style="font-weight:700;color:#4a9fd4;">NT$${w.balance}</span></div><div class="summary-row"><span>✅ 已付款</span><span style="font-weight:700;color:#22c55e;">NT$${w.paid}</span></div><div class="summary-row" style="padding-top:8px;border-top:2px solid #f0d9cc;margin-top:8px;"><span style="font-weight:900;">❌ 未付款</span><span style="font-weight:900;color:#e11d48;font-size:16px;">NT$${unpaid}</span></div></div></div>`;html+=`<div class="card"><h3>購買明細 (${myOrders.length})</h3>`;if(myOrders.length===0){html+=`<div style="text-align:center;color:#999;padding:20px;">還沒有訂單</div>`;}else{myOrders.forEach(o=>{const price=productPrice(o,level);const cb=o.rateType!=='gacha'&&level.cashback>0?Math.ceil(price*level.cashback):0;const finalPrice=price-cb;const fullName=o.remark?`${o.item} - ${o.remark}`:o.item;const rate=o.rateType==='gacha'?'扭蛋':o.rateType==='ticket'?'門票':o.rateType==='souvenir'?'土產':'一般';html+=`<div class="order-detail"><div style="font-weight:700;margin-bottom:6px;">${fullName}</div><div class="detail-row"><span>日幣</span><span>¥${o.price}</span></div><div class="detail-row"><span>匯率</span><span>${rate}</span></div><div class="detail-row"><span>台幣</span><span style="font-weight:700;">NT$${price}</span></div>`;if(cb>0){html+=`<div class="detail-row" style="color:#22c55e;"><span>回饋</span><span>-NT$${cb}</span></div>`;}html+=`<div class="detail-row" style="padding-top:6px;border-top:1px solid #e0e0e0;margin-top:6px;font-weight:700;"><span>實付</span><span style="color:#c8756a;">NT$${finalPrice}</span></div><div style="font-size:11px;color:#999;">📅 ${o.updatedAt||''}</div></div>`;}); }html+=`</div></div>`;app.innerHTML=html;}else if(state.screen==='agent'){let html=`<div class="container"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><h2>👑 業者後台</h2><button class="btn btn-secondary btn-small" onclick="state.screen='login';render();">登出</button></div>`;html+=`<div class="tabs"><button class="tab-btn ${state.tab==='orders'?'active':''}" onclick="state.tab='orders';render();">📋訂單</button><button class="tab-btn ${state.tab==='products'?'active':''}" onclick="state.tab='products';render();">📦商品</button><button class="tab-btn ${state.tab==='clients'?'active':''}" onclick="state.tab='clients';render();">👤客人</button><button class="tab-btn ${state.tab==='lottery'?'active':''}" onclick="state.tab='lottery';render();">🎟️抽獎</button><button class="tab-btn ${state.tab==='summary'?'active':''}" onclick="state.tab='summary';render();">📊對帳</button><button class="tab-btn ${state.tab==='settings'?'active':''}" onclick="state.tab='settings';render();">⚙️</button></div>`;if(state.tab==='orders'){html+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>訂單 (${state.orders.length})</h3><button class="btn btn-primary btn-small" onclick="addOrderModal()">+新增</button></div>`;state.orders.forEach(o=>{const fullName=o.remark?`${o.item}-${o.remark}`:o.item;html+=`<div style="padding:8px;background:#fffaf5;border-radius:8px;margin:4px 0;"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><strong>${o.clientName}</strong><br/><span style="font-size:12px;">${fullName}</span><br/><span style="font-size:11px;color:#666;">¥${o.price} | ${o.status||'待購買'}</span></div><button class="btn btn-primary btn-small" onclick="doEditOrder('${o.id}')">編</button></div></div>`;}); html+=`</div>`;}if(state.tab==='products'){html+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>商品 (${state.products.length})</h3><button class="btn btn-primary btn-small" onclick="addProductModal()">+新增</button></div>`;state.products.forEach(p=>{html+=`<div style="padding:8px;background:#fffaf5;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;"><div style="flex:1;"><strong>${p.name}</strong><br/><span style="font-size:11px;color:#666;">¥${p.price}</span></div><div style="display:flex;gap:4px;"><button class="btn btn-primary btn-small" onclick="doEditProduct('${p.id}')">編</button><button class="btn btn-secondary btn-small" onclick="delProduct('${p.id}')">刪</button></div></div>`;}); html+=`</div>`;}if(state.tab==='clients'){html+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>客人 (${state.clients.length})</h3><button class="btn btn-primary btn-small" onclick="addClientModal()">+新增</button></div>`;state.clients.forEach(c=>{const w=state.wallets[c.clientCode]||{balance:0,paid:0};const myOrders=state.orders.filter(o=>o.clientName===c.name);const totalDep=(w.logs||[]).filter(l=>l.type==='add').reduce((s,l)=>s+l.amount,0);const level=getMemberLevel(totalDep);const total=myOrders.reduce((s,o)=>s+productPrice(o,level),0);const cashback=level.cashback>0?Math.ceil(myOrders.filter(o=>o.rateType!=='gacha').reduce((s,o)=>s+productPrice(o,level),0)*level.cashback):0;const finalTotal=total-cashback;const needToPay=Math.max(0,finalTotal-w.balance);const unpaid=Math.max(0,needToPay-w.paid);html+=`<div style="padding:8px;background:#fffaf5;border-radius:8px;margin:4px 0;"><div><strong>${c.name}</strong> ${level.icon}<br/><span style="font-size:11px;color:#666;">購物金:NT$${w.balance} | 已付:NT$${w.paid} | 未付:NT$${unpaid}</span></div><button class="btn btn-primary btn-small" onclick="openWallet('${c.clientCode}')">管理</button></div>`;}); html+=`</div>`;}if(state.tab==='lottery'){html+=`<div class="card"><h3>🎟️ 抽獎券統計（每 NT$888 = 1 張）</h3>`;let totalTickets=0;state.clients.forEach(c=>{const w=state.wallets[c.clientCode]||{paid:0};const tickets=Math.floor(w.paid/888);totalTickets+=tickets;html+=`<div style="padding:10px;background:#fffaf5;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;"><div><strong>${c.name}</strong><br/><span style="font-size:11px;color:#666;">已付:NT$${w.paid}</span></div><div style="text-align:right;"><span style="font-size:20px;font-weight:700;color:#f59e0b;">🎟️ ${tickets}</span><span style="font-size:11px;display:block;color:#666;">張</span></div></div>`;}); html+=`<div style="padding:12px;background:#fef3c7;border-radius:8px;margin-top:12px;text-align:center;border:2px solid #f59e0b;"><div style="font-weight:700;font-size:14px;">🎉 總抽獎券</div><span style="font-size:28px;font-weight:700;color:#d97706;">🎟️ ${totalTickets}</span><span style="display:block;font-size:12px;color:#666;margin-top:4px;">全客累積</span></div></div>`;}else if(state.tab==='summary'){html+=`<div class="card"><h3>📊 全客人對帳</h3>`;let totalAmount=0,totalCashback=0,totalFinal=0,totalUnpaid=0;state.clients.forEach(c=>{const w=state.wallets[c.clientCode]||{balance:0,paid:0,logs:[]};const myOrders=state.orders.filter(o=>o.clientName===c.name);const totalDep=(w.logs||[]).filter(l=>l.type==='add').reduce((s,l)=>s+l.amount,0);const level=getMemberLevel(totalDep);const total=myOrders.reduce((s,o)=>s+productPrice(o,level),0);const cashback=level.cashback>0?Math.ceil(myOrders.filter(o=>o.rateType!=='gacha').reduce((s,o)=>s+productPrice(o,level),0)*level.cashback):0;const finalTotal=total-cashback;const needToPay=Math.max(0,finalTotal-w.balance);const unpaid=Math.max(0,needToPay-w.paid);totalAmount+=total;totalCashback+=cashback;totalFinal+=finalTotal;totalUnpaid+=unpaid;html+=`<div style="padding:10px;background:#fffaf5;border-radius:8px;margin:4px 0;"><div style="font-weight:700;">${c.name} ${level.icon}</div><div style="font-size:12px;margin-top:4px;"><div>商品:NT$${total} 回饋:-NT$${cashback}</div><div>小計:NT$${finalTotal} 未付:NT$${unpaid}</div></div></div>`;}); html+=`<div style="padding:10px;background:#c8756a20;border-radius:8px;margin-top:8px;font-size:12px;"><div style="font-weight:700;">📈 總計</div><div>商品:NT$${totalAmount} 回饋:-NT$${totalCashback}</div><div>小計:NT$${totalFinal} 未付:NT$${totalUnpaid}</div></div></div>`;}if(state.tab==='settings'){html+=`<div class="card"><h3>⚙️ 會員優惠規則</h3><div style="font-size:12px;color:#666;line-height:1.6;"><div>👤 無優惠:門票0.295 土產0.285</div><div>🥈 銀牌(≥2000):1%回饋 門票0.285 土產0.285</div><div>🥇 黃金(≥4000):1%回饋 門票0.285 土產0.285</div><div>💎 鑽石(≥6000):2%回饋 門票0.285 土產0.275✨</div></div><button class="btn btn-primary" style="margin-top:12px;" onclick="exportExcel()">📥匯出Excel</button><button class="btn btn-secondary" onclick="exportJSON()">📥匯出JSON</button></div>`;}html+=`</div>`;app.innerHTML=html;}}

function loginAgent(){const pwd=document.getElementById('pwd')?.value;if(pwd===AGENT_PASSWORD){state.screen='agent';state.tab='orders';render();}else{alert('密碼錯誤');}}

function loginClient(){const name=document.getElementById('cname')?.value.trim();if(!name){alert('請輸入名字');return;}const c=state.clients.find(x=>x.name===name);if(!c){alert('找不到此客人');return;}state.nick=name;state.screen='client';render();}

function addClientModal(){openModal('<h3>新增客人</h3><input id="newClientName" placeholder="客人名字"/><button class="btn btn-primary" onclick="addClient()">新增</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>');}

function addClient(){const name=document.getElementById('newClientName')?.value.trim();if(!name){alert('請輸入名字');return;}const code='C'+Date.now();state.clients.push({name,clientCode:code});state.wallets[code]={balance:0,paid:0,logs:[]};saveState();closeModal();render();}

function addProductModal(){openModal('<h3>新增商品</h3><input id="prodName" placeholder="商品名稱"/><input id="prodPrice" placeholder="日幣價格" type="number"/><select id="prodType"><option value="general">一般 (0.275)</option><option value="ticket">門票 (0.295)</option><option value="souvenir">土產 (0.285)</option></select><button class="btn btn-primary" onclick="addProduct()">新增</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>');}

function addProduct(){const name=document.getElementById('prodName')?.value.trim();const price=+document.getElementById('prodPrice')?.value;const rateType=document.getElementById('prodType')?.value;if(!name||!price){alert('請填完整');return;}state.products.push({id:'P'+Date.now(),name,price,rateType});saveState();closeModal();render();}

function doEditProduct(id){const p=state.products.find(x=>x.id===id);if(!p){alert('找不到商品');return;}openModal(`<h3>編輯商品</h3><input id="ep" value="${p.name}" placeholder="名稱"/><input id="epp" value="${p.price}" type="number" placeholder="價格"/><select id="ept"><option value="general" ${p.rateType==='general'?'selected':''}>一般</option><option value="ticket" ${p.rateType==='ticket'?'selected':''}>門票</option><option value="souvenir" ${p.rateType==='souvenir'?'selected':''}>土產</option></select><button class="btn btn-primary" onclick="saveProduct('${id}')">儲存</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`);}

function saveProduct(id){const name=document.getElementById('ep')?.value.trim();const price=+document.getElementById('epp')?.value;const rateType=document.getElementById('ept')?.value;if(!name||!price){alert('填完整');return;}const p=state.products.find(x=>x.id===id);if(p){p.name=name;p.price=price;p.rateType=rateType;saveState();closeModal();render();}}

function delProduct(id){if(confirm('刪除?')){state.products=state.products.filter(x=>x.id!==id);saveState();render();}}

function addOrderModal(){const clientOpts=state.clients.map(c=>`<option value="${c.clientCode}|${c.name}">${c.name}</option>`).join('');const prodOpts=state.products.map(p=>`<option value="${p.id}|${p.name}|${p.rateType}">${p.name}</option>`).join('');openModal(`<h3>新增訂單</h3><select id="oclient"><option>選客人</option>${clientOpts}</select><select id="oprod"><option>選商品</option>${prodOpts}</select><input id="oprice" placeholder="日幣" type="number"/><textarea id="oremark" placeholder="備註（買了什麼）"></textarea><button class="btn btn-primary" onclick="addOrder()">新增</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`);}

function addOrder(){const [cc,cn]=(document.getElementById('oclient')?.value||'').split('|');const [pid,pn,pt]=(document.getElementById('oprod')?.value||'').split('|');const price=+document.getElementById('oprice')?.value;const remark=document.getElementById('oremark')?.value.trim();if(!cc||!pid||!price){alert('填完整');return;}state.orders.push({id:'O'+Date.now(),clientName:cn,clientCode:cc,item:pn,price:price,rateType:pt,remark:remark,status:'pending',updatedAt:new Date().toLocaleDateString('zh-TW')});saveState();closeModal();render();}

function doEditOrder(id){const o=state.orders.find(x=>x.id===id);if(!o){alert('找不到訂單');return;}openModal(`<h3>編輯訂單</h3><input id="eo" value="${o.item||''}" placeholder="商品"/><input id="eopr" value="${o.price||''}" type="number" placeholder="日幣"/><textarea id="eor">${o.remark||''}</textarea><select id="eost"><option value="pending" ${o.status==='pending'?'selected':''}>待購買</option><option value="bought" ${o.status==='bought'?'selected':''}>已買到</option><option value="completed" ${o.status==='completed'?'selected':''}>已完成</option></select><button class="btn btn-primary" onclick="saveOrder('${id}')">儲存</button><button class="btn btn-secondary" onclick="delOrder('${id}')">刪除</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`);}

function saveOrder(id){const o=state.orders.find(x=>x.id===id);if(!o){alert('找不到');return;}o.item=document.getElementById('eo')?.value||o.item;o.price=+document.getElementById('eopr')?.value||o.price;o.remark=document.getElementById('eor')?.value.trim()||'';o.status=document.getElementById('eost')?.value||'pending';saveState();closeModal();render();}

function delOrder(id){if(confirm('刪除?')){state.orders=state.orders.filter(x=>x.id!==id);saveState();closeModal();render();}}

function openWallet(cc){const c=state.clients.find(x=>x.clientCode===cc);const w=state.wallets[cc]||{balance:0,paid:0,logs:[]};openModal(`<h3>💰${c.name}</h3><div style="padding:10px;background:#fffaf5;border-radius:8px;margin-bottom:12px;font-size:12px;"><div>購物金:NT$${w.balance}</div><div>已付:NT$${w.paid}</div></div><input id="wamt" placeholder="金額" type="number"/><button class="btn btn-primary" onclick="addBalance('${cc}')">+購物金</button><button class="btn btn-secondary" onclick="addPaid('${cc}')">✅已付款</button><button class="btn btn-secondary" onclick="closeModal()">關</button>`);}

function addBalance(cc){const amt=+document.getElementById('wamt')?.value;if(!amt)return;if(!state.wallets[cc])state.wallets[cc]={balance:0,paid:0,logs:[]};state.wallets[cc].balance+=amt;state.wallets[cc].logs=state.wallets[cc].logs||[];state.wallets[cc].logs.push({type:'add',amount:amt,date:new Date().toLocaleDateString('zh-TW')});saveState();openWallet(cc);}

function addPaid(cc){const amt=+document.getElementById('wamt')?.value;if(!amt)return;if(!state.wallets[cc])state.wallets[cc]={balance:0,paid:0,logs:[]};state.wallets[cc].paid+=amt;state.wallets[cc].logs=state.wallets[cc].logs||[];state.wallets[cc].logs.push({type:'paid',amount:amt,date:new Date().toLocaleDateString('zh-TW')});saveState();openWallet(cc);}

function exportJSON(){const data={orders:state.orders,clients:state.clients,products:state.products,wallets:state.wallets,date:new Date().toLocaleString('zh-TW')};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ShopTrack_${Date.now()}.json`;a.click();}

function exportExcel(){let csv='商品清單\n商品名稱,日幣,台幣,匯率\n';state.products.forEach(p=>{csv+=`"${p.name}",${p.price},${productPrice(p,{})},${p.rateType}\n`;});csv+='\n訂單清單\n客人,商品,備註,日幣,台幣,狀態\n';state.orders.forEach(o=>{csv+=`"${o.clientName}","${o.item}","${o.remark||''}",${o.price},${productPrice(o,{})},${o.status}\n`;});csv+='\n客人清單\n客人名字,購物金,已付款\n';state.clients.forEach(c=>{const w=state.wallets[c.clientCode]||{balance:0,paid:0};csv+=`"${c.name}",${w.balance},${w.paid}\n`;});const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ShopTrack_${Date.now()}.csv`;a.click();}

render();
</script>
</body>
</html>
