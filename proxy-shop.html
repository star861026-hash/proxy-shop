<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopTrack 代購管理系統</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#faf8f5;color:#2d1f1a;}
    .container{max-width:500px;margin:0 auto;padding:12px;min-height:100vh;}
    .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
    .btn{padding:12px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;font-family:"Microsoft JhengHei";transition:all 0.2s;}
    .btn-primary{background:linear-gradient(135deg,#7cb87a,#9ed09c);color:#fff;}
    .btn-secondary{background:#f5f5f5;color:#666;}
    .IS{padding:10px 12px;border:1.5px solid #d0c0b8;border-radius:10px;background:#fff;font-size:14px;font-family:"Microsoft JhengHei";}
    .chip{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;}
    .tap{transition:all 0.2s;user-select:none;}
    .tap:active{opacity:0.8;transform:scale(0.98);}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const RATE_TYPES = {
  general: {label:"一般商品",   rate:0.275, color:"#c8756a"},
  ticket:  {label:"需門票商品", rate:0.295, color:"#f59e0b"},
  souvenir:{label:"土產/大型",  rate:0.285, color:"#22c55e"},
  gacha:   {label:"扭蛋",       rate:null, color:"#a855f7"},
};

const GACHA_PRICES = [{jpy:200,twd:60},{jpy:300,twd:80},{jpy:400,twd:110},{jpy:500,twd:140}];

function gachaTWD(jpy,keepShell){
  const r=GACHA_PRICES.find(x=>x.jpy===+jpy);
  return (r?r.twd:Math.round(+jpy*0.275))+(keepShell?5:0);
}

const MEMBER_LEVELS = [
  {name:"鑽石優惠",minDeposit:6000,cashback:0.02,ticketRate:0.285,souvenirRate:0.275,gift:true, color:"#c8756a",icon:"💎"},
  {name:"黃金優惠",minDeposit:4000,cashback:0.01,ticketRate:0.285,souvenirRate:0.285,gift:true, color:"#f59e0b",icon:"🥇"},
  {name:"銀牌優惠",minDeposit:2000,cashback:0.01,ticketRate:0.295,souvenirRate:0.285,gift:false,color:"#b8887a",icon:"🥈"},
  {name:"無優惠",minDeposit:0,   cashback:0,   ticketRate:0.295,souvenirRate:0.285,gift:false,color:"#d4a898",icon:"👤"},
];

function getMemberLevel(dep){return MEMBER_LEVELS.find(l=>dep>=l.minDeposit)||MEMBER_LEVELS[3];}

function productTWDWithLevel(p,sr,level){
  if(p.rateType==="gacha") return gachaTWD(p.price,p.keepShell);
  if(p.rateType==="ticket") return Math.ceil(p.price*(level?level.ticketRate:0.295));
  if(p.rateType==="souvenir") return Math.ceil(p.price*(level?level.souvenirRate:0.285));
  return Math.ceil(p.price*0.275);
}

const STATUS = {
  pending:{label:"待購買",icon:"⏳"},
  bought:{label:"已買到",icon:"✅"},
  arrived_tw:{label:"已到貨",icon:"📥"},
  consolidating:{label:"集運回台中",icon:"🚢"},
  shipped:{label:"已出貨給客人",icon:"📬"},
  arrived:{label:"已到台灣",icon:"📦"},
  completed:{label:"已完成此筆訂單",icon:"🎉"},
  cancelled:{label:"已取消",icon:"❌"},
};

const LSK=k=>`shoptrack_${k}`;
function load(k,d){try{const v=localStorage.getItem(LSK(k));return v?JSON.parse(v):d;}catch{return d;}}
function save(k,v){try{localStorage.setItem(LSK(k),JSON.stringify(v));}catch(e){alert("儲存失敗");}}

function App(){
  const [isAgent,setIsAgent]=React.useState(null);
  const [nick,setNick]=React.useState("");
  
  const [orders,setOrders]=React.useState(()=>load("orders",[]));
  const [clients,setClients]=React.useState(()=>load("clients",[]));
  const [wallets,setWallets]=React.useState(()=>load("wallets",{}));

  React.useEffect(()=>{save("orders",orders);save("clients",clients);save("wallets",wallets);},[orders,clients,wallets]);

  const [toast,setToast]=React.useState(null);
  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(null),2000);};

  if(isAgent===null){
    return(
      <div className="container" style={{display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",height:"100vh"}}>
        <div style={{fontSize:48,marginBottom:20}}>🛍️</div>
        <div style={{fontSize:28,fontWeight:900,marginBottom:30,textAlign:"center",color:"#c8756a"}}>ShopTrack<br/>代購管理系統</div>
        <button onClick={()=>setIsAgent(true)} className="btn btn-primary" style={{width:200,marginBottom:10}}>👑 闆闆登入</button>
        <button onClick={()=>setIsAgent(false)} className="btn btn-secondary" style={{width:200}}>👤 客人登入</button>
      </div>
    );
  }

  if(isAgent){
    return <AgentView {...{orders,setOrders,clients,setClients,wallets,setWallets,showToast,setIsAgent}}/>;
  }else{
    if(!nick){
      return(
        <div className="container" style={{paddingTop:100,textAlign:"center"}}>
          <div style={{fontSize:36,marginBottom:20}}>👤</div>
          <h2 style={{marginBottom:30}}>客人登入</h2>
          <input className="IS" placeholder="輸入你的名字" value={nick} onChange={e=>setNick(e.target.value)} style={{width:"100%"}}/>
          <button className="btn btn-primary" style={{width:"100%"}} onClick={()=>{if(!nick.trim()){showToast("請輸入名字");return;}const c=clients.find(x=>x.name===nick);if(!c){showToast("找不到此客人");setNick("");return;}}}>進入</button>
          <button className="btn btn-secondary" style={{width:"100%"}} onClick={()=>setIsAgent(null)}>返回</button>
        </div>
      );
    }
    const c=clients.find(x=>x.name===nick);
    if(!c){return <div className="container" style={{paddingTop:100,textAlign:"center"}}>❌ 找不到客人<br/><button className="btn btn-secondary" style={{marginTop:20,width:"100%"}} onClick={()=>{setNick("");setIsAgent(null);}}>返回</button></div>;}
    return <ClientView {...{nick,setNick,clients,orders,wallets,setWallets,showToast,setIsAgent}}/>;
  }
}

function ClientView({nick,setNick,clients,orders,wallets,setWallets,showToast,setIsAgent}){
  const c=clients.find(x=>x.name===nick);
  const myWallet=wallets[c.clientCode]||{balance:0,logs:[]};
  const walletBal=myWallet.balance||0;
  const myOrders=orders.filter(o=>o.clientName===nick||(c&&o.clientCode===c.clientCode));
  const totalDep=(myWallet.logs||[]).filter(l=>l.type==="add").reduce((s,l)=>s+l.amount,0);
  const level=getMemberLevel(totalDep);

  return(
    <div className="container">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,paddingTop:12}}>
        <div style={{fontWeight:900,fontSize:18}}>{nick}</div>
        <button className="btn" style={{padding:"6px 12px",background:"#f5f5f5",color:"#666",fontSize:12,width:"auto"}} onClick={()=>{setNick("");setIsAgent(null);}}>登出</button>
      </div>

      {myOrders.length>0&&(
        <div style={{background:"linear-gradient(135deg,#fff8f0,#fde8d8)",borderRadius:16,padding:"14px 16px",marginBottom:14}}>
          <div style={{fontWeight:700,color:"#2d1f1a",fontSize:15,marginBottom:8}}>💎 {level.icon} {level.name}</div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
            <span style={{color:"#8a6a5a"}}>📦 商品合計</span>
            <span style={{fontWeight:700}}>NT${(myOrders.reduce((s,o)=>s+productTWDWithLevel(o,{},level),0)).toLocaleString()}</span>
          </div>
        </div>
      )}

      {myOrders.length===0?
        <div className="card" style={{padding:40,textAlign:"center",color:"#d4a898"}}><div style={{fontSize:36}}>📋</div><div style={{fontWeight:700,marginTop:8}}>還沒有訂單</div></div>
        :<div style={{display:"flex",flexDirection:"column",gap:10}}>
          {myOrders.map(o=>{
            const s=STATUS[o.status];
            const sell=productTWDWithLevel(o,{},level);
            const cashback=(o.rateType!=="gacha"&&level.cashback>0)?Math.ceil(sell*level.cashback):0;
            return(
              <div key={o.id} className="card">
                <div style={{fontWeight:800,fontSize:15,color:"#2d1f1a",marginBottom:8}}>{o.item} {s?.icon} {s?.label}</div>
                <div style={{background:"#fffaf5",borderRadius:10,padding:"10px 12px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                    <span>售價</span>
                    <span style={{fontWeight:700}}>NT${sell}</span>
                  </div>
                  {cashback>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                    <span style={{color:"#22c55e",fontWeight:700}}>{level.icon} 會員回饋</span>
                    <span style={{color:"#22c55e",fontWeight:700}}>-NT${cashback}</span>
                  </div>}
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:14,paddingTop:6,borderTop:"1px solid #f0d9cc"}}>
                    <span style={{fontWeight:900}}>實付金額</span>
                    <span style={{fontWeight:900,color:"#c8756a",fontSize:16}}>NT${sell-cashback}</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      }
    </div>
  );
}

function AgentView({orders,setOrders,clients,setClients,wallets,setWallets,showToast,setIsAgent}){
  const [tab,setTab]=React.useState("orders");

  return(
    <div className="container">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,paddingTop:12}}>
        <div style={{fontWeight:900,fontSize:18}}>👑 業者後台</div>
        <button className="btn" style={{padding:"6px 12px",background:"#f5f5f5",color:"#666",fontSize:12,width:"auto"}} onClick={()=>setIsAgent(null)}>登出</button>
      </div>

      {tab==="orders"&&(
        <div>
          <h3 style={{marginBottom:12}}>訂單列表 ({orders.length})</h3>
          {orders.length===0?<div style={{textAlign:"center",color:"#999",padding:20}}>沒有訂單</div>:orders.map(o=>(
            <div key={o.id} className="card">
              <div style={{fontWeight:700,marginBottom:4}}>{o.clientName} - {o.item}</div>
              <div style={{fontSize:12,color:"#666"}}>{o.currency} {o.price} → NT${o.price} | {STATUS[o.status]?.label}</div>
            </div>
          ))}
        </div>
      )}

      {tab==="clients"&&(
        <div>
          <h3 style={{marginBottom:12}}>客人管理 ({clients.length})</h3>
          {clients.length===0?<div style={{textAlign:"center",color:"#999",padding:20}}>沒有客人</div>:clients.map(c=>(
            <div key={c.clientCode} className="card">
              <div style={{fontWeight:700}}>{c.name}</div>
              <div style={{fontSize:12,color:"#666"}}>NT${(wallets[c.clientCode]?.balance||0).toLocaleString()}</div>
            </div>
          ))}
          <button className="btn btn-primary" onClick={()=>{const name=prompt("客人名字");if(!name)return;const code=`C${Date.now()}`;setClients([...clients,{name,clientCode:code}]);setWallets({...wallets,[code]:{balance:0,logs:[]}});showToast("已新增客人 👤");}}>+ 新增客人</button>
        </div>
      )}

      {tab==="settings"&&(
        <div className="card">
          <h3 style={{marginBottom:12}}>⚙️ 設定</h3>
          <div style={{color:"#666",marginBottom:12,fontSize:12}}>
            <div>✅ 一般商品: 0.275</div>
            <div>✅ 門票商品: 0.295</div>
            <div>✅ 土產/大型: 0.285</div>
          </div>
          <button className="btn" style={{background:"#fee2e2",color:"#dc2626"}} onClick={()=>{if(window.confirm("確定清除所有訂單?")){setOrders([]);showToast("已清除所有訂單 🗑️");}}}>🗑️ 清除所有訂單</button>
        </div>
      )}

      <div style={{display:"flex",gap:8,marginTop:20,background:"#fffaf5",borderRadius:12,padding:8,position:"fixed",bottom:0,left:0,right:0,maxWidth:500,margin:"0 auto"}}>
        {[{k:"orders",l:"📋"},{k:"clients",l:"👤"},{k:"settings",l:"⚙️"}].map(t=>(
          <button key={t.k} className="tap" onClick={()=>setTab(t.k)} style={{flex:1,padding:10,borderRadius:10,border:"none",background:tab===t.k?"#c8756a":"transparent",color:tab===t.k?"#fff":"#8a6a5a",fontWeight:700}}>
            {t.l}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
