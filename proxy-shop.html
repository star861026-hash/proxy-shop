<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopTrack 代購管理系統</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#faf8f5;color:#2d1f1a;}
    .container{max-width:500px;margin:0 auto;padding:12px;min-height:100vh;}
    .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
    .btn{padding:12px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;}
    .btn-primary{background:linear-gradient(135deg,#7cb87a,#9ed09c);color:#fff;width:100%;margin:8px 0;}
    .btn-secondary{background:#f5f5f5;color:#666;width:100%;margin:8px 0;}
    .btn-small{padding:6px 10px;width:auto;font-size:12px;margin:2px;}
    input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0;font-size:14px;font-family:inherit;}
    textarea{resize:vertical;min-height:60px;}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
    .modal.hide{display:none;}
    .modal-content{background:#fff;border-radius:16px;padding:20px;max-width:480px;max-height:90vh;overflow-y:auto;}
    .tabs{display:flex;gap:8px;margin:12px 0;background:#fffaf5;padding:8px;border-radius:12px;overflow-x:auto;}
    .tab-btn{flex-shrink:0;padding:10px;border:none;border-radius:10px;cursor:pointer;font-weight:700;background:transparent;color:#8a6a5a;font-family:inherit;font-size:13px;}
    .tab-btn.active{background:#c8756a;color:#fff;}
    .order-detail{padding:12px;background:#fffaf5;border-radius:8px;margin-top:8px;border-left:4px solid #c8756a;}
    .detail-row{display:flex;justify-content:space-between;font-size:13px;margin:4px 0;}
    .summary-box{background:linear-gradient(135deg,#fff8f0,#fde8d8);border-radius:12px;padding:12px;margin:8px 0;}
    .summary-row{display:flex;justify-content:space-between;font-size:13px;margin:6px 0;align-items:center;}
    .client-summary{padding:12px;background:#fffaf5;border-radius:8px;margin-bottom:8px;border-left:4px solid #c8756a;}
    .client-summary-row{display:flex;justify-content:space-between;font-size:12px;margin:4px 0;}
    .price-calc{font-size:11px;color:#666;margin-top:2px;}
  </style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hide"><div class="modal-content" id="modal-body"></div></div>

<script>
const LSK=k=>`shoptrack_${k}`;
const load=(k,d)=>{try{const v=localStorage.getItem(LSK(k));return v?JSON.parse(v):d;}catch{return d;}};
const save=(k,v)=>{try{localStorage.setItem(LSK(k),JSON.stringify(v));}catch(e){}};

let state={screen:'login',nick:'',orders:load('orders',[]),clients:load('clients',[]),products:load('products',[]),wallets:load('wallets',{}),tab:'orders'};
const AGENT_PASSWORD='12345';

function saveState(){save('orders',state.orders);save('clients',state.clients);save('products',state.products);save('wallets',state.wallets);}

function getMemberLevel(dep){if(dep>=6000)return{name:"鑽石優惠",cashback:0.02,icon:"💎"};if(dep>=4000)return{name:"黃金優惠",cashback:0.01,icon:"🥇"};if(dep>=2000)return{name:"銀牌優惠",cashback:0.01,icon:"🥈"};return{name:"無優惠",cashback:0,icon:"👤"};}

function productPrice(p,level){if(p.rateType==='gacha'){const prices=[{jpy:200,twd:60},{jpy:300,twd:80},{jpy:400,twd:110},{jpy:500,twd:140}];const r=prices.find(x=>x.jpy===+p.price);return(r?r.twd:Math.round(p.price*0.275))+(p.keepShell?5:0);}if(p.rateType==='ticket')return Math.ceil(p.price*(level?0.285:0.295));if(p.rateType==='souvenir')return Math.ceil(p.price*(level?0.275:0.285));return Math.ceil(p.price*0.275);}

function openModal(html){document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').classList.remove('hide');}
function closeModal(){document.getElementById('modal').classList.add('hide');}

function render(){const app=document.getElementById('app');if(state.screen==='login'){app.innerHTML=`<div class="container" style="text-align:center;padding-top:80px;"><div style="font-size:48px;margin-bottom:20px;">🛍️</div><h1 style="margin-bottom:40px;">ShopTrack</h1><button class="btn btn-primary" onclick="state.screen='agent-login';render();">👑 闆闆登入</button><button class="btn btn-secondary" onclick="state.screen='client-login';render();">👤 客人登入</button></div>`;}else if(state.screen==='agent-login'){app.innerHTML=`<div class="container" style="text-align:center;padding-top:60px;"><h2 style="margin-bottom:30px;">闆闆登入</h2><input id="pwd" type="password" placeholder="輸入密碼"/><button class="btn btn-primary" onclick="loginAgent()">進入</button><button class="btn btn-secondary" onclick="state.screen='login';render();">返回</button></div>`;setTimeout(()=>document.getElementById('pwd')?.focus(),100);}else if(state.screen==='client-login'){app.innerHTML=`<div class="container" style="text-align:center;padding-top:60px;"><h2 style="margin-bottom:30px;">客人登入</h2><input id="cname" placeholder="輸入你的名字"/><button class="btn btn-primary" onclick="loginClient()">進入</button><button class="btn btn-secondary" onclick="state.screen='login';render();">返回</button></div>`;setTimeout(()=>document.getElementById('cname')?.focus(),100);}else if(state.screen==='client'){const c=state.clients.find(x=>x.name===state.nick);const w=state.wallets[c?.clientCode]||{balance:0,paid:0,logs:[]};const myOrders=state.orders.filter(o=>o.clientName===state.nick);const totalDep=(w.logs||[]).filter(l=>l.type==='add').reduce((s,l)=>s+l.amount,0);const level=getMemberLevel(totalDep);let html=`<div class="container"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><h2>${state.nick}</h2><button class="btn btn-secondary btn-small" onclick="state.screen='login';render();">登出</button></div>`;const total=myOrders.reduce((s,o)=>s+productPrice(o,level),0);const cashback=level.cashback>0?Math.ceil(myOrders.filter(o=>o.rateType!=='gacha').reduce((s,o)=>s+productPrice(o,level),0)*level.cashback):0;const finalTotal=total-cashback;const needToPay=Math.max(0,finalTotal-w.balance);const unpaid=Math.max(0,needToPay-w.paid);html+=`<div class="card"><div class="summary-box"><div class="summary-row"><span>📦 商品合計</span><span style="font-weight:700;">NT$${total.toLocaleString()}</span></div>`;if(cashback>0){html+=`<div class="summary-row"><span style="color:#22c55e;font-weight:700;">${level.icon} 會員回饋</span><span style="color:#22c55e;font-weight:700;">-NT$${cashback}</span></div>`;}html+=`<div class="summary-row" style="padding-top:8px;border-top:1px solid #f0d9cc;margin-top:8px;"><span>小計</span><span style="font-weight:700;">NT$${finalTotal.toLocaleString()}</span></div><div class="summary-row"><span>💰 購物金</span><span style="font-weight:700;color:#4a9fd4;">NT$${w.balance}</span></div><div class="summary-row"><span>✅ 已付款</span><span style="font-weight:700;color:#22c55e;">NT$${w.paid}</span></div><div class="summary-row" style="padding-top:8px;border-top:2px solid #f0d9cc;margin-top:8px;"><span style="font-weight:900;">❌ 扣完儲值金後未付款</span><span style="font-weight:900;color:#e11d48;font-size:16px;">NT$${unpaid.toLocaleString()}</span></div></div></div>`;html+=`<div class="card"><h3>購買明細 (${myOrders.length})</h3>`;if(myOrders.length===0){html+=`<div style="text-align:center;color:#999;padding:20px;">還沒有訂單</div>`;}else{myOrders.forEach(o=>{const price=productPrice(o,level);const cb=o.rateType!=='gacha'&&level.cashback>0?Math.ceil(price*level.cashback):0;const finalPrice=price-cb;const fullName=o.remark?`${o.item} - ${o.remark}`:o.item;const rate=o.rateType==='gacha'?'扭蛋':o.rateType==='ticket'?'門票':o.rateType==='souvenir'?'土產':'一般';const rateNum=o.rateType==='ticket'?0.295:o.rateType==='souvenir'?0.285:0.275;html+=`<div class="order-detail"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;"><div style="font-weight:700;font-size:14px;line-height:1.4;">${fullName}</div><span style="background:#c8756a;color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;white-space:nowrap;margin-left:8px;">${o.status}</span></div><div class="detail-row"><span>日幣價格</span><span>¥${o.price}</span></div><div class="detail-row"><span>匯率類型</span><span>${rate}</span></div><div class="detail-row"><span>計算方式</span><span style="font-size:11px;">¥${o.price}×${rateNum}=${(o.price*rateNum).toFixed(1)}</span></div><div class="detail-row"><span>台幣售價</span><span style="font-weight:700;">NT$${price}</span></div>`;if(cb>0){html+=`<div class="detail-row" style="color:#22c55e;"><span>${level.icon}會員回饋${(level.cashback*100).toFixed(0)}%</span><span>-NT$${cb}</span></div>`;}html+=`<div class="detail-row" style="padding-top:6px;border-top:1px solid #e0e0e0;margin-top:6px;font-weight:700;"><span>實付金額</span><span style="color:#c8756a;font-size:15px;">NT$${finalPrice}</span></div><div style="font-size:11px;color:#999;margin-top:4px;">📅 ${o.updatedAt}</div></div>`;}); }html+=`</div></div>`;app.innerHTML=html;}else if(state.screen==='agent'){let html=`<div class="container"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><h2>👑 業者後台</h2><button class="btn btn-secondary btn-small" onclick="state.screen='login';render();">登出</button></div>`;html+=`<div class="tabs"><button class="tab-btn ${state.tab==='orders'?'active':''}" onclick="state.tab='orders';render();">📋訂單</button><button class="tab-btn ${state.tab==='products'?'active':''}" onclick="state.tab='products';render();">📦商品</button><button class="tab-btn ${state.tab==='clients'?'active':''}" onclick="state.tab='clients';render();">👤客人</button><button class="tab-btn ${state.tab==='summary'?'active':''}" onclick="state.tab='summary';render();">📊對帳</button><button class="tab-btn ${state.tab==='settings'?'active':''}" onclick="state.tab='settings';render();">⚙️</button></div>`;if(state.tab==='orders'){html+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>訂單 (${state.orders.length})</h3><button class="btn btn-primary btn-small" onclick="addOrderModal()">+新增</button></div>`;state.orders.forEach(o=>{const fullName=o.remark?`${o.item}-${o.remark}`:o.item;html+=`<div style="padding:8px;background:#fffaf5;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;"><div><strong>${o.clientName}</strong><br/><span style="font-size:12px;">${fullName}</span><br/><span style="font-size:11px;color:#666;">¥${o.price}→NT$${productPrice(o,{})} | ${o.status}</span></div><button class="btn btn-primary btn-small" onclick="editOrderModal('${o.id}')">編</button></div>`;}); html+=`</div>`;}if(state.tab==='products'){html+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>商品 (${state.products.length})</h3><button class="btn btn-primary btn-small" onclick="addProductModal()">+新增</button></div>`;state.products.forEach(p=>{html+=`<div style="padding:8px;background:#fffaf5;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;"><div style="flex:1;"><strong>${p.name}</strong><br/><span style="font-size:11px;color:#666;">¥${p.price}→NT$${productPrice(p,{})}</span></div><div style="display:flex;gap:4px;"><button class="btn btn-primary btn-small" onclick="editProductModal('${p.id}')">編</button><button class="btn btn-secondary btn-small" onclick="delProduct('${p.id}')">刪</button></div></div>`;}); html+=`</div>`;}if(state.tab==='clients'){html+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>客人 (${state.clients.length})</h3><button class="btn btn-primary btn-small" onclick="addClientModal()">+新增</button></div>`;state.clients.forEach(c=>{const w=state.wallets[c.clientCode]||{balance:0,paid:0};html+=`<div style="padding:8px;background:#fffaf5;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;"><div><strong>${c.name}</strong><br/><span style="font-size:11px;color:#666;">購物金:NT$${w.balance} | 已付:NT$${w.paid}</span></div><button class="btn btn-primary btn-small" onclick="openWallet('${c.clientCode}')">管理</button></div>`;}); html+=`</div>`;}if(state.tab==='summary'){html+=`<div class="card"><h3>📊 全客人對帳表</h3>`;let totalAmount=0,totalCashback=0,totalFinal=0,totalBalance=0,totalPaid=0,totalUnpaid=0;state.clients.forEach(c=>{const w=state.wallets[c.clientCode]||{balance:0,paid:0,logs:[]};const myOrders=state.orders.filter(o=>o.clientName===c.name);const totalDep=(w.logs||[]).filter(l=>l.type==='add').reduce((s,l)=>s+l.amount,0);const level=getMemberLevel(totalDep);const total=myOrders.reduce((s,o)=>s+productPrice(o,level),0);const cashback=level.cashback>0?Math.ceil(myOrders.filter(o=>o.rateType!=='gacha').reduce((s,o)=>s+productPrice(o,level),0)*level.cashback):0;const finalTotal=total-cashback;const needToPay=Math.max(0,finalTotal-w.balance);const unpaid=Math.max(0,needToPay-w.paid);totalAmount+=total;totalCashback+=cashback;totalFinal+=finalTotal;totalBalance+=w.balance;totalPaid+=w.paid;totalUnpaid+=unpaid;html+=`<div class="client-summary"><div style="font-weight:700;margin-bottom:6px;">${c.name}</div><div class="client-summary-row"><span>商品合計</span><span>NT$${total}</span></div><div class="client-summary-row"><span>會員回饋</span><span style="color:#22c55e;">-NT$${cashback}</span></div><div class="client-summary-row"><span>小計</span><span style="font-weight:700;">NT$${finalTotal}</span></div><div class="client-summary-row"><span>購物金</span><span>NT$${w.balance}</span></div><div class="client-summary-row"><span>已付款</span><span style="color:#22c55e;">NT$${w.paid}</span></div><div class="client-summary-row" style="padding-top:4px;border-top:1px solid #e0e0e0;margin-top:4px;font-weight:700;"><span>未付款</span><span style="color:#e11d48;">NT$${unpaid}</span></div></div>`;}); html+=`<div style="padding:12px;background:#c8756a20;border-radius:8px;margin-top:12px;"><div style="font-weight:700;margin-bottom:6px;">📈 總計</div><div class="client-summary-row"><span>總商品合計</span><span>NT$${totalAmount}</span></div><div class="client-summary-row"><span>總回饋</span><span style="color:#22c55e;">-NT$${totalCashback}</span></div><div class="client-summary-row"><span>總小計</span><span style="font-weight:700;">NT$${totalFinal}</span></div><div class="client-summary-row"><span>購物金總額</span><span>NT$${totalBalance}</span></div><div class="client-summary-row"><span>已收款總額</span><span style="color:#22c55e;">NT$${totalPaid}</span></div><div class="client-summary-row" style="padding-top:4px;border-top:1px solid #e0e0e0;margin-top:4px;font-weight:700;"><span>未收款總額</span><span style="color:#e11d48;font-size:14px;">NT$${totalUnpaid}</span></div></div></div>`;}if(state.tab==='settings'){html+=`<div class="card"><h3>⚙️設定</h3><div style="color:#666;font-size:12px;margin-bottom:12px;"><div>✅一般:0.275 | ✅門票:0.295 | ✅土產:0.285</div></div><button class="btn btn-primary" onclick="exportExcel()">📥匯出Excel</button><button class="btn btn-secondary" onclick="exportJSON()">📥匯出JSON</button></div>`;}html+=`</div>`;app.innerHTML=html;}}

function loginAgent(){const pwd=document.getElementById('pwd')?.value;if(pwd===AGENT_PASSWORD){state.screen='agent';state.tab='orders';render();}else{alert('密碼錯誤');}}

function loginClient(){const name=document.getElementById('cname')?.value.trim();if(!name){alert('請輸入名字');return;}const c=state.clients.find(x=>x.name===name);if(!c){alert('找不到此客人');return;}state.nick=name;state.screen='client';render();}

function addClientModal(){openModal('<h3>新增客人</h3><input id="newClientName" placeholder="客人名字"/><button class="btn btn-primary" onclick="addClient()">新增</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>');}

function addClient(){const name=document.getElementById('newClientName')?.value.trim();if(!name){alert('請輸入名字');return;}const code='C'+Date.now();state.clients.push({name,clientCode:code});state.wallets[code]={balance:0,paid:0,logs:[]};saveState();closeModal();render();}

function addProductModal(){openModal('<h3>新增商品</h3><input id="prodName" placeholder="商品名稱"/><input id="prodPrice" placeholder="日幣價格" type="number"/><select id="prodType"><option value="general">一般 (0.275)</option><option value="ticket">門票 (0.295)</option><option value="souvenir">土產 (0.285)</option><option value="gacha">扭蛋</option></select><button class="btn btn-primary" onclick="addProduct()">新增</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>');}

function addProduct(){const name=document.getElementById('prodName')?.value.trim();const price=+document.getElementById('prodPrice')?.value;const rateType=document.getElementById('prodType')?.value;if(!name||!price){alert('請填完整');return;}state.products.push({id:'P'+Date.now(),name,price,rateType});saveState();closeModal();render();}

function editProductModal(id){const p=state.products.find(x=>x.id===id);if(!p){alert('找不到此商品');return;}let html=`<h3>編輯商品</h3><input id="pname" type="text" placeholder="商品名稱"/><input id="pprice" type="number" placeholder="日幣價格"/><select id="ptype"><option value="general">一般 (0.275)</option><option value="ticket">門票 (0.295)</option><option value="souvenir">土產 (0.285)</option><option value="gacha">扭蛋</option></select><button class="btn btn-primary" onclick="saveProduct('${id}')">儲存</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`;openModal(html);setTimeout(()=>{document.getElementById('pname').value=p.name;document.getElementById('pprice').value=p.price;document.getElementById('ptype').value=p.rateType;},100);}

function saveProduct(id){const name=document.getElementById('pname')?.value.trim();const price=+document.getElementById('pprice')?.value;const rateType=document.getElementById('ptype')?.value;if(!name||!price){alert('請填完整');return;}const p=state.products.find(x=>x.id===id);if(!p)return;p.name=name;p.price=price;p.rateType=rateType;saveState();closeModal();render();}

function delProduct(id){if(confirm('確定刪除?')){state.products=state.products.filter(x=>x.id!==id);saveState();render();}}

function addOrderModal(){const clientOpts=state.clients.map(c=>`<option value="${c.clientCode}|${c.name}">${c.name}</option>`).join('');const prodOpts=state.products.map(p=>`<option value="${p.id}|${p.name}|${p.rateType}">${p.name}</option>`).join('');openModal(`<h3>新增訂單</h3><select id="oclient"><option>選客人</option>${clientOpts}</select><select id="oprod"><option>選商品</option>${prodOpts}</select><input id="oprice" placeholder="日幣" type="number"/><textarea id="oremark" placeholder="備註（例如：海苔味、草莓口味等詳細說明）"></textarea><select id="ostatus"><option value="pending">待購買</option><option value="bought">已買到</option><option value="completed">已完成</option></select><button class="btn btn-primary" onclick="addOrder()">新增</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`);}

function addOrder(){const [cc,cn]=(document.getElementById('oclient')?.value||'').split('|');const [pid,pn,pt]=(document.getElementById('oprod')?.value||'').split('|');const price=+document.getElementById('oprice')?.value;const remark=document.getElementById('oremark')?.value.trim();const status=document.getElementById('ostatus')?.value;if(!cc||!pid||!price){alert('請填完整');return;}state.orders.push({id:'O'+Date.now(),clientName:cn,clientCode:cc,item:pn,price,rateType:pt,remark,status,updatedAt:new Date().toLocaleDateString('zh-TW')});saveState();closeModal();render();}

function editOrderModal(id){const o=state.orders.find(x=>x.id===id);if(!o){alert('找不到此訂單');return;}let html=`<h3>編輯訂單</h3><input id="oitem" type="text" value="${o.item}" placeholder="商品名稱"/><input id="oprice" type="number" value="${o.price}" placeholder="日幣價格"/><select id="ortype"><option value="general" ${o.rateType==='general'?'selected':''}>一般</option><option value="ticket" ${o.rateType==='ticket'?'selected':''}>門票</option><option value="souvenir" ${o.rateType==='souvenir'?'selected':''}>土產</option><option value="gacha" ${o.rateType==='gacha'?'selected':''}>扭蛋</option></select><textarea id="oremark">${o.remark||''}</textarea><select id="ostatus"><option value="pending" ${o.status==='pending'?'selected':''}>待購買</option><option value="bought" ${o.status==='bought'?'selected':''}>已買到</option><option value="completed" ${o.status==='completed'?'selected':''}>已完成</option></select><button class="btn btn-primary" onclick="saveOrder('${id}')">儲存</button><button class="btn btn-secondary" onclick="delOrder('${id}')">刪除</button><button class="btn btn-secondary" onclick="closeModal()">取消</button>`;openModal(html);}

function saveOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;o.item=document.getElementById('oitem')?.value.trim();o.price=+document.getElementById('oprice')?.value;o.rateType=document.getElementById('ortype')?.value;o.remark=document.getElementById('oremark')?.value.trim();o.status=document.getElementById('ostatus')?.value;saveState();closeModal();render();}

function delOrder(id){if(confirm('確定刪除?')){state.orders=state.orders.filter(x=>x.id!==id);saveState();closeModal();render();}}

function openWallet(cc){const c=state.clients.find(x=>x.clientCode===cc);const w=state.wallets[cc]||{balance:0,paid:0,logs:[]};openModal(`<h3>💰${c.name}財務管理</h3><div style="padding:12px;background:#fffaf5;border-radius:8px;margin-bottom:12px;"><div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>購物金:</span><strong style="color:#4a9fd4;">NT$${w.balance}</strong></div><div style="display:flex;justify-content:space-between;"><span>已付款:</span><strong style="color:#22c55e;">NT$${w.paid}</strong></div></div><input id="wamt" placeholder="金額" type="number"/><button class="btn btn-primary" onclick="addBalance('${cc}')">+加購物金</button><button class="btn btn-secondary" onclick="addPaid('${cc}')">✅ 標記已付款</button><button class="btn btn-secondary" onclick="closeModal()">關閉</button>`);}

function addBalance(cc){const amt=+document.getElementById('wamt')?.value;if(!amt)return;if(!state.wallets[cc])state.wallets[cc]={balance:0,paid:0,logs:[]};state.wallets[cc].balance+=amt;state.wallets[cc].logs=state.wallets[cc].logs||[];state.wallets[cc].logs.push({type:'add',amount:amt,date:new Date().toLocaleDateString('zh-TW')});saveState();openWallet(cc);}

function addPaid(cc){const amt=+document.getElementById('wamt')?.value;if(!amt)return;if(!state.wallets[cc])state.wallets[cc]={balance:0,paid:0,logs:[]};state.wallets[cc].paid+=amt;state.wallets[cc].logs=state.wallets[cc].logs||[];state.wallets[cc].logs.push({type:'paid',amount:amt,date:new Date().toLocaleDateString('zh-TW')});saveState();openWallet(cc);}

function exportJSON(){const data={orders:state.orders,clients:state.clients,products:state.products,wallets:state.wallets,date:new Date().toLocaleString('zh-TW')};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ShopTrack_${Date.now()}.json`;a.click();}

function exportExcel(){let csv='商品清單\n商品名稱,日幣,台幣,匯率\n';state.products.forEach(p=>{csv+=`"${p.name}",${p.price},${productPrice(p,{})},${p.rateType}\n`;});csv+='\n訂單清單\n客人,商品,備註,日幣,台幣,狀態,日期\n';state.orders.forEach(o=>{csv+=`"${o.clientName}","${o.item}","${o.remark||''}",${o.price},${productPrice(o,{})},${o.status},${o.updatedAt}\n`;});csv+='\n客人清單\n客人名字,購物金,已付款\n';state.clients.forEach(c=>{const w=state.wallets[c.clientCode]||{balance:0,paid:0};csv+=`"${c.name}",${w.balance},${w.paid}\n`;});const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ShopTrack_${Date.now()}.csv`;a.click();}

render();
</script>
</body>
