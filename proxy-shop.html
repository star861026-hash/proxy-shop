<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopTrack 代購</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft JhengHei', Arial, sans-serif; background: #faf8f5; color: #2d1f1a; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; min-height: 100vh; }
    .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .btn { padding: 12px 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; margin: 8px 0; width: 100%; }
    .btn-primary { background: linear-gradient(135deg, #7cb87a, #9ed09c); color: white; }
    .btn-secondary { background: #f5f5f5; color: #666; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin: 8px 0; font-size: 14px; }
    h1, h2, h3 { margin: 16px 0 8px 0; }
    .hide { display: none; }
    .center { text-align: center; padding: 40px 20px; }
    .tab-content { margin-bottom: 100px; }
    .tabs { display: flex; gap: 8px; background: #fffaf5; padding: 8px; border-radius: 12px; position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; }
    .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div id="login-screen">
    <div class="center">
      <div style="font-size: 48px; margin-bottom: 20px;">🛍️</div>
      <h1>ShopTrack</h1>
      <p style="color: #999; margin-bottom: 30px;">代購管理系統</p>
      <button class="btn btn-primary" onclick="startAgent()">👑 闆闆登入</button>
      <button class="btn btn-secondary" onclick="startClientLogin()">👤 客人登入</button>
    </div>
  </div>

  <div id="client-login-screen" class="hide">
    <h2>客人登入</h2>
    <input id="clientName" placeholder="輸入你的名字" />
    <button class="btn btn-primary" onclick="enterClient()">進入</button>
    <button class="btn btn-secondary" onclick="goBack()">返回</button>
  </div>

  <div id="client-screen" class="hide">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 id="clientNameDisplay"></h2>
      <button class="btn" style="width: auto; padding: 6px 12px; background: #f5f5f5;" onclick="goBack()">登出</button>
    </div>

    <div id="client-tab-orders" class="tab-content">
      <div class="card">
        <h3>訂單</h3>
        <div id="orders-list" style="color: #999; text-align: center; padding: 20px;">還沒有訂單</div>
      </div>
      <div class="card">
        <h3>購物金</h3>
        <div id="wallet-display" style="font-size: 20px; font-weight: bold;">NT$0</div>
      </div>
    </div>
  </div>

  <div id="agent-screen" class="hide">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2>👑 業者後台</h2>
      <button class="btn" style="width: auto; padding: 6px 12px; background: #f5f5f5;" onclick="goBack()">登出</button>
    </div>

    <div id="agent-tab-orders" class="tab-content hide">
      <h3>訂單 (<span id="order-count">0</span>)</h3>
      <div id="agent-orders-list" style="color: #999; text-align: center; padding: 20px;">沒有訂單</div>
    </div>

    <div id="agent-tab-clients" class="tab-content hide">
      <h3>客人 (<span id="client-count">0</span>)</h3>
      <div id="agent-clients-list" style="color: #999; text-align: center; padding: 20px;">沒有客人</div>
      <button class="btn btn-primary" onclick="addClient()">+ 新增客人</button>
    </div>

    <div id="agent-tab-settings" class="tab-content hide">
      <div class="card">
        <h3>⚙️ 設定</h3>
        <div style="color: #666; margin-bottom: 12px; font-size: 12px;">
          <div>✅ 一般商品: 0.275</div>
          <div>✅ 門票商品: 0.295</div>
          <div>✅ 土產/大型: 0.285</div>
        </div>
        <button class="btn" style="background: #fee2e2; color: #dc2626;" onclick="clearAllOrders()">🗑️ 清除所有訂單</button>
      </div>
    </div>
  </div>

  <div id="tabs" class="tabs hide">
    <button class="tab-btn" id="tab-orders" style="background: #c8756a; color: white;" onclick="switchTab('orders')">📋</button>
    <button class="tab-btn" id="tab-clients" style="background: transparent; color: #8a6a5a;" onclick="switchTab('clients')">👤</button>
    <button class="tab-btn" id="tab-settings" style="background: transparent; color: #8a6a5a;" onclick="switchTab('settings')">⚙️</button>
  </div>
</div>

<script>
const LSK = k => `shoptrack_${k}`;
const load = (k, d) => { try { const v = localStorage.getItem(LSK(k)); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(LSK(k), JSON.stringify(v)); } catch(e) { alert('儲存失敗'); } };

let state = {
  currentScreen: 'login',
  currentTab: 'orders',
  currentClientName: '',
  orders: load('orders', []),
  clients: load('clients', []),
  wallets: load('wallets', {})
};

function saveState() {
  save('orders', state.orders);
  save('clients', state.clients);
  save('wallets', state.wallets);
}

function render() {
  document.getElementById('login-screen').classList.toggle('hide', state.currentScreen !== 'login');
  document.getElementById('client-login-screen').classList.toggle('hide', state.currentScreen !== 'client-login');
  document.getElementById('client-screen').classList.toggle('hide', state.currentScreen !== 'client');
  document.getElementById('agent-screen').classList.toggle('hide', state.currentScreen !== 'agent');
  document.getElementById('tabs').classList.toggle('hide', !['agent', 'client'].includes(state.currentScreen));

  if (state.currentScreen === 'client') {
    const c = state.clients.find(x => x.name === state.currentClientName);
    const w = state.wallets[c?.clientCode] || {balance: 0};
    const myOrders = state.orders.filter(o => o.clientName === state.currentClientName);
    
    document.getElementById('clientNameDisplay').textContent = state.currentClientName;
    document.getElementById('orders-list').innerHTML = myOrders.length === 0 ? 
      '<div style="color: #999;">還沒有訂單</div>' :
      myOrders.map(o => `<div style="padding: 10px; background: #fffaf5; border-radius: 8px; margin-top: 8px;"><div>${o.item}</div><div style="font-size: 12px; color: #666;">NT$${o.price}</div></div>`).join('');
    document.getElementById('wallet-display').textContent = `NT$${w.balance}`;
  }

  if (state.currentScreen === 'agent') {
    document.getElementById('order-count').textContent = state.orders.length;
    document.getElementById('client-count').textContent = state.clients.length;
    
    document.getElementById('agent-orders-list').innerHTML = state.orders.length === 0 ?
      '<div style="color: #999;">沒有訂單</div>' :
      state.orders.map(o => `<div class="card"><div>${o.clientName} - ${o.item}</div><div style="font-size: 12px; color: #666;">${o.price}</div></div>`).join('');
    
    document.getElementById('agent-clients-list').innerHTML = state.clients.length === 0 ?
      '<div style="color: #999;">沒有客人</div>' :
      state.clients.map(c => `<div class="card"><div>${c.name}</div></div>`).join('');

    ['orders', 'clients', 'settings'].forEach(tab => {
      document.getElementById(`agent-tab-${tab}`).classList.toggle('hide', state.currentTab !== tab);
      document.getElementById(`tab-${tab}`).style.background = state.currentTab === tab ? '#c8756a' : 'transparent';
      document.getElementById(`tab-${tab}`).style.color = state.currentTab === tab ? 'white' : '#8a6a5a';
    });
  }
}

function startAgent() {
  state.currentScreen = 'agent';
  state.currentTab = 'orders';
  render();
}

function startClientLogin() {
  state.currentScreen = 'client-login';
  document.getElementById('clientName').value = '';
  render();
}

function enterClient() {
  const name = document.getElementById('clientName').value.trim();
  if (!name) { alert('請輸入名字'); return; }
  const c = state.clients.find(x => x.name === name);
  if (!c) { alert('找不到此客人'); return; }
  state.currentClientName = name;
  state.currentScreen = 'client';
  render();
}

function goBack() {
  state.currentScreen = 'login';
  state.currentTab = 'orders';
  render();
}

function switchTab(tab) {
  state.currentTab = tab;
  render();
}

function addClient() {
  const name = prompt('客人名字:');
  if (!name) return;
  const code = `C${Date.now()}`;
  state.clients.push({name, clientCode: code});
  state.wallets[code] = {balance: 0};
  saveState();
  render();
}

function clearAllOrders() {
  if (window.confirm('確定清除所有訂單?')) {
    state.orders = [];
    saveState();
    render();
  }
}

render();
</script>
</body>
</html>
